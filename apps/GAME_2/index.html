<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aerostar — Balloon Journey</title>
  <meta name="description" content="A real-wind virtual hot-air-balloon journey.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css?v=20261107-flightview">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- ===== Заметные информаторы поверх карты (добавлено) ===== -->
   <style>
    /* === HUD: поверх карты === */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 1200;
      pointer-events: none; /* Клики проходят сквозь пустую область */
    }
    .hud > * {
      pointer-events: auto; /* Элементы внутри HUD кликабельны */
    }

    /* === Информационные плашки === */
    #hint.map-hint,
    #flight-status.flight-status,
    #wind-status.wind-status {
      position: fixed;
      z-index: 1200;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: min(92vw, 520px);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(12, 18, 28, 0.85);
      color: #ffffff;
      font: 600 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      box-shadow:
        0 6px 22px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.15) inset;
      backdrop-filter: blur(8px) saturate(1.2);
      -webkit-backdrop-filter: blur(8px) saturate(1.2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* Позиции */
    #hint.map-hint {
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
    }
    #flight-status.flight-status {
      left: max(16px, env(safe-area-inset-left));
      bottom: calc(80px + env(safe-area-inset-bottom));
    }
    #wind-status.wind-status {
      left: max(16px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
    }

    /* Точки-индикаторы */
    #flight-status.flight-status::before,
    #wind-status.wind-status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #6ee7ff;
      box-shadow: 0 0 10px rgba(110, 231, 255, 0.9);
    }
    #wind-status.wind-status::before {
      background: #ffd166;
      box-shadow: 0 0 10px rgba(255, 209, 102, 0.9);
    }

    /* === Кнопки START / RESET === */
    .map-controls {
      position: fixed;
      z-index: 1210;
      bottom: max(16px, env(safe-area-inset-bottom));
      right: max(16px, env(safe-area-inset-right));
      display: flex;
      gap: 10px;
      pointer-events: auto;
      /* Убедимся, что кнопки не растягиваются на весь экран */
      width: auto;
      max-width: max-content;
    }

    .map-controls .custom-button {
      /* Защита от наследования width: 100% */
      width: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* === Загрузочный экран === */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      place-items: center;
      background: rgba(4, 8, 14, 0.92);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #loading .loading-card {
      background: rgba(10, 16, 26, 0.88);
      color: #fff;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      padding: 22px 26px;
      max-width: min(92vw, 420px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #loading .loading-status {
      font: 700 17px/1.3 system-ui, sans-serif;
    }
    #loading .loading-card p {
      font: 400 14px/1.45 system-ui, sans-serif;
      color: rgba(255,255,255,.78);
      margin: 0;
    }
  </style>
</head>
<body>
  <h1 class="seo-h1">Aerostar — Real Wind Hot Air Balloon Journey</h1>

  <main id="app" class="app">
    <!-- World map is the launch map before START and the locator inset during flight. -->
    <section class="world-map-wrap" aria-label="World map">
      <div id="map"></div>
      <div id="mapCaption" class="map-caption" aria-live="polite">Select a launch point</div>
      <div class="world-map-label">WORLD POSITION</div>
    </section>

    <!-- Main point-of-view map is revealed after START. -->
    <section id="pov-panel" class="pov-panel" aria-label="View from the balloon">
      <div id="pov-map"></div>
      <div class="pov-vignette" aria-hidden="true"></div>
      <canvas id="haze-canvas" aria-hidden="true"></canvas>

      <!-- Realistic transparent basket and suspension ropes -->
      <img
        id="basket-overlay"
        class="basket-overlay"
        src="images/basket-overlay.png"
        alt=""
        aria-hidden="true"
        draggable="false"
      >

      <div class="view-label">BALLOON · LOW-ALTITUDE VIEW</div>
    </section>

    <!-- Creature overlay belongs to the POV map, but remains above both maps. -->
    <div class="creature-overlay" id="creatureOverlay" aria-live="polite">
      <img id="creatureImg" src="" alt="Mythical creature">
      <button class="release-btn" id="releaseBtn" type="button" title="Dismiss creature" aria-label="Dismiss creature">×</button>
      <div class="creature-name" id="creatureName"></div>
    </div>
  </main>

  <!-- ===== HUD: информаторы и кнопки (вынесено из #app) ===== -->
  <div class="hud">
    <div id="hint" class="map-hint">Click anywhere on the map to choose a launch point</div>
    <div id="flight-status" class="flight-status" aria-live="polite">Choose your launch point</div>
    <div id="wind-status" class="wind-status" aria-live="polite">Wind: waiting for location</div>

    <div class="map-controls">
      <button class="custom-button" id="startBtn" type="button" disabled>▶ START</button>
      <button class="custom-button" id="resetBtn" type="button">↺ RESET</button>
    </div>
  </div>

  <div id="loading" class="loading">
    <div class="loading-card">
      <div class="loading-spinner"></div>
      <div class="loading-status">Preparing your balloon…</div>
      <p>Choose a place on Earth and let the wind decide the journey.</p>
    </div>
  </div>

  <!-- Keep config/api/ui: UI helpers and the Open-Meteo wind adapter are used by this build.
       No GAME_2 request is made to Aerost.art /api/balloons or /api/wind. -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/zones.js"></script>
  <script src="js/balloon.js"></script>
  <script src="js/main.js"></script>
  <script src="js/creatures.js"></script>

  <!-- Bridge for the creature module. -->
  <script>
    window.checkNearbyPlace = function (lat, lon) {
      const zone = window.MagicZones?.findByCoordinates(
        Number(lat),
        Number(lon)
      );

      if (zone) {
        window.App.currentZone = zone;
      }

      if (window.AerostarCreatures?.update) {
        window.AerostarCreatures.update(
          Number(lat),
          Number(lon),
          zone
        );
      }
    };
  </script>
</body>
</html>
