<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aerostar — Race Registration</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 42px; color: #f87171; }
        .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .card {
            background: rgba(15,23,42,0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
        }
        .card h2 { color: #38bdf8; margin-bottom: 15px; font-size: 20px; }
        #map { height: 400px; border-radius: 16px; overflow: hidden; margin-bottom: 15px; }
        .catalog-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .skin-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .skin-card.selected { border-color: #38bdf8; background: rgba(56,189,248,0.15); }
        .skin-preview { font-size: 32px; }
        .skin-name { font-size: 11px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #94a3b8; }
        input {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: white;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .participants-table { width: 100%; border-collapse: collapse; }
        .participants-table th, .participants-table td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .coords-display { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; font-size: 12px; text-align: center; margin-top: 10px; }
        .start-zone-info { font-size: 12px; color: #f87171; margin-top: 10px; text-align: center; }
        @media (max-width: 900px) { .two-columns { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>🎈 Fiesta Race Registration</h1><p>Select your start location on the map and register</p></div>
        <div class="two-columns">
            <div class="card">
                <h2>🗺️ Select Start Location</h2>
                <div id="map"></div>
                <div id="start-coords-display" class="coords-display">Click on map in allowed zone</div>
                <div id="zone-info" class="start-zone-info"></div>
            </div>
            <div class="card">
                <h2>📝 Registration</h2>
                <div class="form-group"><label>Pilot Name</label><input type="text" id="player-name" placeholder="Your nickname" /></div>
                <div class="form-group"><label>Balloon</label><div class="catalog-grid" id="catalog-grid"></div></div>
                <div id="participants-count" style="font-size: 12px; color: #f87171; margin-bottom: 10px;"></div>
                <button id="btn-register" disabled>🚀 Register for Race</button>
                <div id="register-message" style="margin-top: 10px; font-size: 12px; text-align: center;"></div>
            </div>
        </div>
        <div class="card"><h2>👥 Registered Pilots</h2><div id="participants-container">Loading...</div></div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let map, socket, finishMarker, startZoneLayer;
        let selectedCoords = null, selectedStyleId = 'classic', currentConfig = null, participants = [];
        const MAX_PARTICIPANTS = 7;
        
        function initMap() {
            map = L.map('map').setView([30, -90], 4);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
            map.on('click', (e) => { if (currentConfig && isInStartZone(e.latlng)) selectStartLocation(e.latlng); });
        }
        
        function isInStartZone(latlng) {
            if (!currentConfig) return false;
            if (currentConfig.zoneType === 'circle') {
                const zone = currentConfig.startZone;
                const R = 6371;
                const dLat = (latlng.lat - zone.centerLat) * Math.PI / 180;
                const dLng = (latlng.lng - zone.centerLng) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(zone.centerLat * Math.PI/180) * Math.cos(latlng.lat * Math.PI/180) * Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c <= zone.radius;
            } else {
                const zone = currentConfig.allowedStartRegion;
                return latlng.lat >= zone.minLat && latlng.lat <= zone.maxLat && latlng.lng >= zone.minLng && latlng.lng <= zone.maxLng;
            }
        }
        
        function updateStartZoneDisplay() {
            if (startZoneLayer) map.removeLayer(startZoneLayer);
            if (!currentConfig) return;
            if (currentConfig.zoneType === 'circle') {
                const zone = currentConfig.startZone;
                startZoneLayer = L.circle([zone.centerLat, zone.centerLng], { radius: zone.radius * 1000, color: '#f87171', fillColor: '#f87171', fillOpacity: 0.1 }).addTo(map);
                document.getElementById('zone-info').innerHTML = `📍 Start Zone: Circle radius ${zone.radius} km around (${zone.centerLat}, ${zone.centerLng})`;
            } else {
                const zone = currentConfig.allowedStartRegion;
                startZoneLayer = L.rectangle([[zone.minLat, zone.minLng], [zone.maxLat, zone.maxLng]], { color: '#f87171', fillColor: '#f87171', fillOpacity: 0.1 }).addTo(map);
                document.getElementById('zone-info').innerHTML = `📍 Start Zone: Rectangle Lat ${zone.minLat}°-${zone.maxLat}°, Lng ${zone.minLng}°-${zone.maxLng}°`;
            }
        }
        
        function selectStartLocation(latlng) {
            selectedCoords = latlng;
            if (window.startMarker) map.removeLayer(window.startMarker);
            window.startMarker = L.marker([latlng.lat, latlng.lng]).addTo(map);
            document.getElementById('start-coords-display').innerHTML = `📍 ${latlng.lat.toFixed(4)}°, ${latlng.lng.toFixed(4)}°`;
            checkRegistration();
        }
        
        function checkRegistration() {
            const btn = document.getElementById('btn-register');
            const name = document.getElementById('player-name').value.trim();
            const isValid = name && selectedCoords && participants.length < MAX_PARTICIPANTS;
            btn.disabled = !isValid;
            if (participants.length >= MAX_PARTICIPANTS) document.getElementById('participants-count').innerHTML = `⚠️ Maximum ${MAX_PARTICIPANTS} participants reached`;
            else document.getElementById('participants-count').innerHTML = `📊 ${participants.length}/${MAX_PARTICIPANTS} registered`;
        }
        
        function updateParticipantsTable() {
            const container = document.getElementById('participants-container');
            if (!participants.length) { container.innerHTML = '<div class="coords-display">No participants yet...</div>'; return; }
            container.innerHTML = `<table class="participants-table"><thead><tr><th>Pilot</th><th>Balloon</th><th>Race #</th></tr></thead><tbody>${participants.map(p => `<tr><td>${p.username}</td><td>🎈 ${p.balloonStyle?.name || 'Classic'}</td><td>#${p.raceNumber}</td></tr>`).join('')}</tbody></table>`;
            checkRegistration();
        }
        
        function connect() {
            socket = io({ transports: ['polling'], upgrade: false });
            socket.on('connect', () => socket.emit('fiesta-auth', { email: 'player@race.com', username: 'Player' }));
            socket.on('fiesta-race-config', (config) => { currentConfig = config; updateFinishMarker(); updateStartZoneDisplay(); });
            socket.on('fiesta-balloon-catalog', (catalog) => { updateBalloonCatalog(catalog); });
            socket.on('fiesta-all-balloons', (balloons) => { participants = balloons; updateParticipantsTable(); });
            socket.on('fiesta-balloon-created', (b) => { socket.emit('fiesta-all-balloons'); });
            socket.on('fiesta-error', (msg) => { document.getElementById('register-message').innerHTML = `<span style="color:#ef4444;">${msg}</span>`; });
        }
        
        function updateFinishMarker() {
            if (finishMarker) map.removeLayer(finishMarker);
            if (currentConfig?.finishCoords) {
                finishMarker = L.marker([currentConfig.finishCoords.lat, currentConfig.finishCoords.lng], { icon: L.divIcon({ html: '🏁', iconSize: [32,32] }) }).addTo(map);
                finishMarker.bindPopup('🏁 FINISH LINE');
            }
        }
        
        function updateBalloonCatalog(catalog) {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            Object.values(catalog).forEach(item => {
                const card = document.createElement('div');
                card.className = `skin-card ${item.id === 'classic' ? 'selected' : ''}`;
                card.innerHTML = `<div class="skin-preview">🎈</div><div class="skin-name">${item.name}</div>`;
                card.onclick = () => { document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('selected')); card.classList.add('selected'); selectedStyleId = item.id; };
                grid.appendChild(card);
            });
        }
        
        document.getElementById('btn-register').addEventListener('click', () => {
            if (selectedCoords && participants.length < MAX_PARTICIPANTS) {
                socket.emit('fiesta-start-flight', { lat: selectedCoords.lat, lng: selectedCoords.lng, styleId: selectedStyleId });
                document.getElementById('register-message').innerHTML = '<span style="color:#22c55e;">✅ Registered! Go to Race Map to fly.</span>';
                setTimeout(() => { window.location.href = 'fiesta.html'; }, 2000);
            }
        });
        document.getElementById('player-name').addEventListener('input', checkRegistration);
        
        initMap();
        connect();
    </script>
</body>
</html>
