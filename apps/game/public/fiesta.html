<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Аэростар — Виртуальная Фиеста</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Стили интерфейса -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        
        #sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            color: white;
            z-index: 2;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #f87171;
            border-bottom: 2px solid #f87171;
            padding-bottom: 8px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #cbd5e1;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #10b981;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .telemetry-box {
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
        }
        
        .tel-row {
            font-size: 13px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .tel-val {
            color: #38bdf8;
            font-weight: bold;
        }
        
        .hidden {
            display: none !important;
        }
        
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .skin-card {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .skin-card:hover {
            background: rgba(51, 65, 85, 0.9);
            transform: scale(1.05);
        }
        
        .skin-card.selected {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.2);
        }
        
        .skin-preview {
            font-size: 32px;
            margin-bottom: 5px;
        }
        
        .skin-name {
            font-size: 11px;
        }
        
        .alt-slider {
            width: 100%;
            margin: 10px 0;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #f87171;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="sidebar">
        <!-- Экран регистрации -->
        <div id="screen-register">
            <h2>🎈 Регистрация в Фиесте</h2>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 15px;">🎯 Кликните на карту в районе Америки, чтобы выбрать место старта.</p>
            
            <div class="form-group">
                <label>Позывной пилота</label>
                <input type="text" id="player-name" placeholder="Введите ваш никнейм..." value="Organizer" />
            </div>
            
            <div class="form-group">
                <label>Выберите аэростат</label>
                <div class="catalog-grid" id="catalog-grid">
                    <div class="skin-card" data-id="classic">
                        <div class="skin-preview">🎈</div>
                        <div class="skin-name">Классический</div>
                    </div>
                    <div class="skin-card" data-id="fire_red">
                        <div class="skin-preview">🎈</div>
                        <div class="skin-name">Огненный</div>
                    </div>
                    <div class="skin-card" data-id="ocean_blue">
                        <div class="skin-preview">🎈</div>
                        <div class="skin-name">Океанский</div>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Координаты старта</label>
                <div id="start-coords-text" style="font-size: 13px; color: #38bdf8; font-weight: bold;">Не выбраны (кликните на карту)</div>
            </div>
            
            <button id="btn-takeoff" disabled>🚀 ВЗЛЕТ</button>
        </div>
        
        <!-- Экран полета -->
        <div id="screen-flight" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0; border: none;" id="flight-hull-number">Борт №---</h2>
                <span class="status-badge">В ПОЛЁТЕ</span>
            </div>
            
            <div class="telemetry-box">
                <div class="tel-row">Пилот: <span class="tel-val" id="tel-name">---</span></div>
                <div class="tel-row">Скорость: <span class="tel-val" id="tel-speed">0 км/ч</span></div>
                <div class="tel-row">Высота: <span class="tel-val" id="tel-altitude">1000 м</span></div>
                <div class="tel-row">Ветер: <span class="tel-val" id="tel-layer">---</span></div>
            </div>
            
            <div class="form-group">
                <label>Высота полета: <span id="alt-slider-val">1000</span> м</label>
                <input type="range" id="alt-slider" class="alt-slider" min="500" max="13000" step="500" value="1000" />
                <p style="font-size: 11px; color: #94a3b8; margin-top: 8px;">Меняйте высоту, чтобы ловить попутные ветры</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <script>
        // Инициализация карты
        const map = L.map('map').setView([30, -90], 4);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
            subdomains: 'abcd'
        }).addTo(map);
        
        // Подключение к WebSocket
        const socket = io('http://91.149.179.79:3001', {
            transports: ['websocket', 'polling'],
            reconnection: true
        });
        
        // Состояние
        let selectedStartCoords = null;
        let selectedStyleId = 'classic';
        let startMarker = null;
        let myBalloonId = null;
        let balloons = {};
        
        // Обработка выбора стиля
        document.querySelectorAll('.skin-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedStyleId = card.dataset.id;
                checkValidation();
            });
        });
        
        // Клик по карте
        map.on('click', (e) => {
            const isRegScreen = !document.getElementById('screen-flight').classList.contains('hidden');
            if (isRegScreen) return;
            
            selectedStartCoords = e.latlng;
            if (startMarker) map.removeLayer(startMarker);
            startMarker = L.marker([selectedStartCoords.lat, selectedStartCoords.lng]).addTo(map);
            document.getElementById('start-coords-text').innerText = `${selectedStartCoords.lat.toFixed(4)}°, ${selectedStartCoords.lng.toFixed(4)}°`;
            checkValidation();
        });
        
        function checkValidation() {
            const btn = document.getElementById('btn-takeoff');
            const name = document.getElementById('player-name').value.trim();
            if (selectedStartCoords && name && selectedStyleId) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }
        
        document.getElementById('player-name').addEventListener('input', checkValidation);
        
        // WebSocket события
        socket.on('connect', () => {
            console.log('✅ Connected to server');
            socket.emit('fiesta-auth', {
                email: 'aerostar@aerost.art',
                username: document.getElementById('player-name').value
            });
        });
        
        socket.on('fiesta-balloon-catalog', (catalog) => {
            console.log('Catalog received:', catalog);
        });
        
        socket.on('fiesta-race-config', (config) => {
            console.log('Race config:', config);
        });
        
        socket.on('fiesta-my-state', (balloon) => {
            console.log('My balloon:', balloon);
            myBalloonId = balloon.id;
            document.getElementById('screen-register').classList.add('hidden');
            document.getElementById('screen-flight').classList.remove('hidden');
            document.getElementById('flight-hull-number').innerText = `Борт ${balloon.raceNumber}`;
            document.getElementById('tel-name').innerText = balloon.username;
            document.getElementById('tel-speed').innerText = `${Math.round(balloon.speed)} км/ч`;
            document.getElementById('tel-altitude').innerText = `${balloon.altitude} м`;
            document.getElementById('tel-layer').innerText = balloon.layerName || 'Нижний слой';
        });
        
        socket.on('fiesta-balloon-updated', (balloon) => {
            if (balloons[balloon.id]) {
                balloons[balloon.id].marker.setLatLng([balloon.lat, balloon.lng]);
            }
            if (myBalloonId === balloon.id) {
                document.getElementById('tel-speed').innerText = `${Math.round(balloon.speed)} км/ч`;
                document.getElementById('tel-altitude').innerText = `${balloon.altitude} м`;
            }
        });
        
        socket.on('fiesta-balloon-created', (balloon) => {
            const marker = L.marker([balloon.lat, balloon.lng], {
                icon: L.divIcon({ html: '🎈', className: '', iconSize: [32, 32] })
            }).addTo(map);
            balloons[balloon.id] = { marker, data: balloon };
        });
        
        // Взлет
        document.getElementById('btn-takeoff').addEventListener('click', () => {
            socket.emit('fiesta-start-flight', {
                lat: selectedStartCoords.lat,
                lng: selectedStartCoords.lng,
                styleId: selectedStyleId
            });
        });
        
        // Изменение высоты
        const slider = document.getElementById('alt-slider');
        const sliderVal = document.getElementById('alt-slider-val');
        slider.addEventListener('input', (e) => {
            sliderVal.innerText = e.target.value;
        });
        slider.addEventListener('change', (e) => {
            socket.emit('fiesta-change-altitude', { altitude: parseInt(e.target.value) });
        });
        
        console.log('Game client ready');
    </script>
</body>
</html>
