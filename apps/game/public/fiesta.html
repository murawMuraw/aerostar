<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aerostar — Fiesta Race Map</title>
    
    <!-- Local Leaflet CSS -->
    <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/game-ui.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        
        /* Flight info panel */
        #flight-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            display: none;
        }
        
        #flight-panel.active {
            display: block;
        }
        
        #register-link {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        
        #register-link:hover {
            transform: translateY(-2px);
        }
        
        #start-instruction {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 2000;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            color: #38bdf8;
            pointer-events: none;
        }
        
        .telemetry-box {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 12px;
            margin: 15px 0;
        }
        
        .tel-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .tel-val {
            color: #38bdf8;
            font-weight: bold;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            background: #10b981;
        }
        
        .alt-slider {
            width: 100%;
            margin: 10px 0;
            -webkit-appearance: none;
            background: #334155;
            height: 4px;
            border-radius: 2px;
        }
        
        .alt-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
        }
        
        .balloon-marker {
            font-size: 28px;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.8));
        }
        
        .finish-marker {
            font-size: 28px;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <!-- Register link -->
    <a href="register.html" id="register-link" target="_blank">🎈 Register for Race</a>
    
    <!-- Start instruction -->
    <div id="start-instruction">
        ✨ Click on map in allowed region to set start location → Go to Register page
    </div>
    
    <!-- Flight panel (visible after takeoff) -->
    <div id="flight-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #38bdf8;" id="flight-number">Flight #---</h3>
            <span class="status-badge">IN FLIGHT</span>
        </div>
        
        <div class="telemetry-box">
            <div class="tel-row">Pilot: <span class="tel-val" id="tel-name">---</span></div>
            <div class="tel-row">Speed: <span class="tel-val" id="tel-speed">0 km/h</span></div>
            <div class="tel-row">Altitude: <span class="tel-val" id="tel-altitude">1000 m</span></div>
            <div class="tel-row">Wind Layer: <span class="tel-val" id="tel-layer">---</span></div>
        </div>
        
        <div>
            <label>Altitude: <span id="alt-slider-val">1000</span> m</label>
            <input type="range" id="alt-slider" class="alt-slider" min="500" max="13000" step="500" value="1000" />
            <div style="font-size: 10px; color: #94a3b8; margin-top: 5px;">💨 Change altitude to catch favorable winds</div>
        </div>
    </div>

    <script src="lib/leaflet/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <script>
        let map, socket;
        let selectedStartCoords = null;
        let startMarker = null;
        let myBalloonId = null;
        let balloonMarker = null;
        let pathLine = null;
        let finishMarker = null;
        let currentConfig = null;
        
        // Wait for map
        const waitForMap = setInterval(() => {
            if (window.map) {
                clearInterval(waitForMap);
                initGame();
            }
        }, 100);
        
        function initGame() {
            map = window.map;
            
            map.on('click', (e) => {
                if (!myBalloonId) {
                    const { lat, lng } = e.latlng;
                    
                    // Check if in allowed region
                    if (currentConfig && currentConfig.allowedStartRegion) {
                        const region = currentConfig.allowedStartRegion;
                        if (lat >= region.minLat && lat <= region.maxLat &&
                            lng >= region.minLng && lng <= region.maxLng) {
                            selectedStartCoords = { lat, lng };
                            
                            if (startMarker) map.removeLayer(startMarker);
                            startMarker = L.marker([lat, lng]).addTo(map);
                            
                            // Save to localStorage for register page
                            localStorage.setItem('fiesta_start_coords', JSON.stringify(selectedStartCoords));
                            
                            // Show instruction update
                            document.getElementById('start-instruction').innerHTML = 
                                '✅ Start location selected! Go to Register page →';
                            document.getElementById('start-instruction').style.color = '#22c55e';
                            
                            setTimeout(() => {
                                document.getElementById('start-instruction').innerHTML = 
                                    '✨ Click on map to change start location → Go to Register page';
                                document.getElementById('start-instruction').style.color = '#38bdf8';
                            }, 3000);
                        } else {
                            document.getElementById('start-instruction').innerHTML = 
                                '⚠️ Click in allowed region (Americas): Lat 15-60°, Lng -130 to -30°';
                            document.getElementById('start-instruction').style.color = '#f87171';
                            setTimeout(() => {
                                document.getElementById('start-instruction').innerHTML = 
                                    '✨ Click on map in allowed region to set start location → Go to Register page';
                                document.getElementById('start-instruction').style.color = '#38bdf8';
                            }, 3000);
                        }
                    }
                }
            });
            
            connectSocket();
        }
        
        function connectSocket() {
            socket = io({
                transports: ['polling'],
                upgrade: false,
                reconnection: true
            });
            
            socket.on('connect', () => {
                console.log('✅ Connected to race server');
                socket.emit('fiesta-auth', {
                    email: 'viewer@race.com',
                    username: 'Race Viewer'
                });
            });
            
            socket.on('fiesta-race-config', (config) => {
                currentConfig = config;
                updateFinishMarker(config);
            });
            
            socket.on('fiesta-my-state', (balloon) => {
                startFlight(balloon);
            });
            
            socket.on('fiesta-balloon-updated', (balloon) => {
                if (myBalloonId === balloon.id) {
                    updateMyBalloon(balloon);
                } else {
                    updateOtherBalloon(balloon);
                }
            });
            
            socket.on('fiesta-error', (msg) => {
                console.error('Error:', msg);
            });
        }
        
        function updateFinishMarker(config) {
            if (config.finishCoords && map) {
                if (finishMarker) {
                    finishMarker.setLatLng([config.finishCoords.lat, config.finishCoords.lng]);
                } else {
                    const finishIcon = L.divIcon({ html: '🏁', iconSize: [32, 32], className: 'finish-marker' });
                    finishMarker = L.marker([config.finishCoords.lat, config.finishCoords.lng], { icon: finishIcon })
                        .addTo(map)
                        .bindPopup('<b>🏁 FINISH LINE</b><br>Race destination');
                }
            }
        }
        
        function startFlight(balloon) {
            myBalloonId = balloon.id;
            document.getElementById('flight-panel').classList.add('active');
            document.getElementById('register-link').style.display = 'none';
            document.getElementById('start-instruction').style.display = 'none';
            
            document.getElementById('flight-number').innerHTML = `Flight ${balloon.raceNumber}`;
            document.getElementById('tel-name').innerHTML = balloon.username;
            document.getElementById('tel-speed').innerHTML = `${Math.round(balloon.speed)} km/h`;
            document.getElementById('tel-altitude').innerHTML = `${balloon.altitude} m`;
            document.getElementById('tel-layer').innerHTML = balloon.layerName || 'Surface Layer';
            
            const balloonIcon = L.divIcon({ html: '🎈', iconSize: [32, 32], className: 'balloon-marker' });
            balloonMarker = L.marker([balloon.lat, balloon.lng], { icon: balloonIcon }).addTo(map);
            map.setView([balloon.lat, balloon.lng], 8);
            
            if (startMarker) map.removeLayer(startMarker);
            
            // Remove start coords from localStorage
            localStorage.removeItem('fiesta_start_coords');
        }
        
        function updateMyBalloon(balloon) {
            if (balloonMarker) {
                balloonMarker.setLatLng([balloon.lat, balloon.lng]);
                document.getElementById('tel-speed').innerHTML = `${Math.round(balloon.speed)} km/h`;
                document.getElementById('tel-altitude').innerHTML = `${balloon.altitude} m`;
                document.getElementById('tel-layer').innerHTML = balloon.layerName;
                
                if (balloon.path && balloon.path.length > 0) {
                    const pathCoords = balloon.path.map(p => [p.lat, p.lng]);
                    if (pathLine) {
                        pathLine.setLatLngs(pathCoords);
                    } else {
                        pathLine = L.polyline(pathCoords, { color: '#f87171', weight: 3, opacity: 0.7 }).addTo(map);
                    }
                }
            }
        }
        
        function updateOtherBalloon(balloon) {
            // Optional: show other balloons on map
        }
        
        const slider = document.getElementById('alt-slider');
        const sliderVal = document.getElementById('alt-slider-val');
        if (slider) {
            slider.addEventListener('input', (e) => sliderVal.innerHTML = e.target.value);
            slider.addEventListener('change', (e) => {
                if (socket && myBalloonId) {
                    socket.emit('fiesta-change-altitude', { altitude: parseInt(e.target.value) });
                }
            });
        }
    </script>
</body>
</html>
