<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aerostar — Fiesta Race Map</title>
    <!-- Локальное подключение стилей Leaflet для защиты от Tracking Prevention -->
    <link rel="stylesheet" href="/lib/leaflet/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; }
        .control-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            gap: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            border: none;
            cursor: pointer;
            display: inline-block;
        }
        .btn:hover { transform: translateY(-2px); }
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 260px;
            z-index: 2000;
            background: rgba(15,23,42,0.95);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            font-size: 12px;
            color: white;
        }
        .info-panel h3 { color: #38bdf8; margin-bottom: 10px; font-size: 14px; }
        .info-item { display: flex; justify-content: space-between; margin: 8px 0; }
        .deadline { color: #f87171; font-weight: bold; }
        .weather-item { display: flex; justify-content: space-between; margin: 5px 0; font-size: 11px; }
        @media (max-width: 768px) { .info-panel { width: 220px; padding: 10px; } .btn { padding: 8px 16px; font-size: 12px; } }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>🏁 Race Info</h3>
        <div class="info-item"><span>⏰ Race Ends:</span><span class="deadline" id="race-deadline">--</span></div>
        <div class="info-item"><span>🏆 Finish:</span><span id="finish-coords">--</span></div>
        <h3>🌤️ Weather at Finish</h3>
        <div id="finish-weather"><div class="weather-item">Loading...</div></div>
        <div class="info-item" style="margin-top: 10px;"><span>🎈 Active Balloons:</span><span id="balloon-count">0</span></div>
    </div>
    <div class="control-panel">
        <a href="gondola.html" class="btn" id="gondola-btn" style="display: none;">🎈 My Gondola</a>
        <a href="register.html" class="btn" id="register-btn">📝 Register</a>
    </div>

   <script src="/lib/leaflet/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let map, socket, finishMarker, balloonsMarkers = {}, myBalloonId = null, currentConfig = null;
        
       function initMap() {
    map = L.map('map').setView([30, -90], 4);
    
    // Исправлено: полный корректный путь к серверу тайлов Esri World Imagery
    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles © Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
        maxZoom: 19
    });

    esriSatellite.addTo(map);

    L.control.scale({
        metric: true,
        position: 'bottomleft'
    }).addTo(map);
}      
       
        
        function updateFinishWeather(lat, lng) {
    if (!lat || !lng) return;
    // ИСПРАВЛЕНО: правильный URL с параметрами
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`)
        .then(r => {
            if (!r.ok) throw new Error('Ошибка сети при запросе погоды');
            return r.json();
        })
        .then(data => {
            if (data && data.current_weather) {
                const w = data.current_weather;
                document.getElementById('finish-weather').innerHTML = `
                    <div class="weather-item">🌡️ Temp: ${w.temperature}°C</div>
                    <div class="weather-item">💨 Wind: ${w.windspeed} m/s</div>
                    <div class="weather-item">🧭 Dir: ${w.winddirection}°</div>
                `;
            } else {
                document.getElementById('finish-weather').innerHTML = `
                    <div class="weather-item" style="color: #fbbf24;">⏳ Нет данных погоды</div>
                `;
            }
        })
        .catch(err => {
            console.error('Weather fetch error:', err);
            document.getElementById('finish-weather').innerHTML = `
                <div class="weather-item" style="color: #f87171;">🌧️ Погода временно недоступна</div>
            `;
        });
}
        
        function clearBalloons() {
            Object.values(balloonsMarkers).forEach(marker => {
                if (marker && map) map.removeLayer(marker);
            });
            balloonsMarkers = {};
        }
        
        function updateBalloons(balloons) {
            if (!map) return;
            clearBalloons();
            
            if (!balloons || !Array.isArray(balloons)) return;
            
            balloons.forEach(b => {
                if (b && b.lat && b.lng) {
                    const isMyBalloon = myBalloonId === b.id;
                    const icon = L.divIcon({ 
                        html: `<div style="font-size: 22px; text-align: center;">${isMyBalloon ? '🎈' : '🪁'}</div>`, 
                        iconSize: [28, 28],
                        className: isMyBalloon ? 'my-balloon-marker' : 'balloon-marker'
                    });
                    try {
                        const marker = L.marker([b.lat, b.lng], { icon }).addTo(map);
                        marker.bindPopup(`<b>${b.username || '?'}</b><br>#${b.raceNumber || '?'}<br>${Math.round(b.speed || 0)} km/h`);
                        balloonsMarkers[b.id] = marker;
                    } catch(e) {
                        console.error('Error creating marker:', e);
                    }
                }
            });
            document.getElementById('balloon-count').innerHTML = Object.keys(balloonsMarkers).length;
        }
        
        function connect() {
            socket = io({
                transports: ['polling'],
                upgrade: false,
                reconnection: true
            });
            
            socket.on('connect', () => {
                console.log('✅ Connected to race server');
                socket.emit('fiesta-auth', { 
                    email: localStorage.getItem('fiesta_email') || 'viewer@race.com', 
                    username: localStorage.getItem('fiesta_name') || 'Viewer' 
                });
            });
            
            socket.on('connect_error', (error) => {
                console.error('Connection error:', error);
            });
            
            socket.on('fiesta-race-config', (config) => {
                 console.log('🔍 Получен конфиг:', config); // <-- Должен выводиться в консоль
                if (!config) return;
                currentConfig = config;
                console.log('Получен конфиг гонки:', config); // Лог для проверки прихода координат
                if (config.finishCoords && config.finishCoords.lat && config.finishCoords.lng) {
                    document.getElementById('finish-coords').innerHTML = `${config.finishCoords.lat.toFixed(2)}°, ${config.finishCoords.lng.toFixed(2)}°`;
                    document.getElementById('race-deadline').innerHTML = config.startWindowTo ? new Date(config.startWindowTo).toLocaleString() : '--';
                    
                    if (finishMarker && map) map.removeLayer(finishMarker);
                    
                    const finishIcon = L.divIcon({ 
                        html: '<div style="font-size: 26px; text-align: center; line-height: 32px;">🏁</div>', 
                        iconSize: [32, 32],
                        className: '' 
                    });
                    
                    finishMarker = L.marker([config.finishCoords.lat, config.finishCoords.lng], { icon: finishIcon }).addTo(map);
                    finishMarker.bindPopup('🏁 FINISH LINE');
                    
                    // Фокусируем камеру на точку финиша
                    map.setView([config.finishCoords.lat, config.finishCoords.lng], 6);
                    map.invalidateSize();
                    updateFinishWeather(config.finishCoords.lat, config.finishCoords.lng);
                }else {
        // Добавьте для отладки:
        console.warn('Нет координат финиша в конфиге:', config);
    }
            });
            
            socket.on('fiesta-my-state', (balloon) => {
                if (balloon && balloon.id) {
                    myBalloonId = balloon.id;
                    localStorage.setItem('fiesta_name', balloon.username);
                    document.getElementById('gondola-btn').style.display = 'block';
                    document.getElementById('register-btn').style.display = 'none';
                    console.log('My balloon ID:', myBalloonId);
                }
            });
            
            socket.on('fiesta-all-balloons', (balloons) => {
                if (balloons && Array.isArray(balloons)) {
                    updateBalloons(balloons);
                }
            });
            
            socket.on('fiesta-balloon-created', () => {
                socket.emit('fiesta-get-participants');
            });
            
            socket.on('fiesta-balloon-updated', () => {
                socket.emit('fiesta-get-participants');
            });
            
            socket.on('fiesta-balloon-removed', () => {
                socket.emit('fiesta-get-participants');
            });
            
            socket.on('fiesta-error', (msg) => {
                console.error('Server error:', msg);
            });
        }
        
        // Надежная инициализация после полной загрузки всех библиотек и скриптов
        window.addEventListener('load', () => {
            if (typeof L !== 'undefined') {
                initMap();
                setTimeout(() => {
                    connect();
                }, 500);
            } else {
                console.error('Ошибка: Локальная библиотека Leaflet не загружена. Проверьте теги подключения.');
            }
        });
        
        // Периодическое обновление погоды
        setInterval(() => {
            if (currentConfig?.finishCoords?.lat && currentConfig?.finishCoords?.lng) {
                updateFinishWeather(currentConfig.finishCoords.lat, currentConfig.finishCoords.lng);
            }
        }, 60000);
    </script>
</body>
</html>
