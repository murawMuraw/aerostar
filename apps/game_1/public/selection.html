<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aerostar Regatta - Choose Ship</title>

<style>

body {

    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at center,
    #123,
    #020812);

    color:white;

    font-family:
    Arial,
    sans-serif;

}


.container {

    width:360px;

    background:
    rgba(0,0,0,0.75);

    border-radius:20px;

    padding:35px;

    text-align:center;

    box-shadow:
    0 20px 60px black;

}



h1 {

    color:#ffd966;

}



.subtitle {

    color:#aaa;

    margin-bottom:25px;

}



.ship {

    border:2px solid rgba(255,255,255,.2);

    border-radius:15px;

    padding:20px;

    cursor:pointer;

    transition:.3s;

}



.ship:hover {

    border-color:#4a9eff;

    transform:translateY(-5px);

}



.ship img {

    width:180px;

}



.ship-name {

    margin-top:15px;

    font-size:20px;

    color:#ffd966;

}



button {


    margin-top:25px;

    width:100%;

    padding:14px;


    border:0;

    border-radius:12px;


    background:
    linear-gradient(
    135deg,
    #4a9eff,
    #6c5ce7
    );


    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}



button:disabled {

    opacity:.5;

}



.status {

    margin-top:15px;

    color:#aaa;

}



</style>

</head>


<body>


<div class="container">


<h1>
⛵ Aerostar Regatta
</h1>


<div class="subtitle">

Your ship follows real ocean currents and wind.

</div>



<div class="ship" id="shipCard">


<img src="images/klip_20.png">


<div class="ship-name">

Clipper 20

</div>


</div>



<button id="start">

🚀 Start Sailing

</button>


<div class="status" id="status">

Waiting...

</div>


</div>



<script>


const start =
document.getElementById("start");


const status =
document.getElementById("status");


let selected=true;



start.onclick = async ()=>{


if(!selected)
return;



start.disabled=true;


status.innerHTML=
"Creating your ship...";



try{


const response =
await fetch(
"/api/ship/create",
{

method:"POST",

headers:
{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

shipType:"klip_20"

})

});



const data =
await response.json();



if(data.success){


localStorage.setItem(
"shipId",
data.ship.id
);



status.innerHTML=
"⛵ Ship ready!";



setTimeout(()=>{


window.location.href="/";


},1000);



}
else{


throw new Error(
data.message
);


}



}
catch(e){


console.error(e);


status.innerHTML=
"❌ Server error";


start.disabled=false;


}



};



</script>


</body>
</html>
