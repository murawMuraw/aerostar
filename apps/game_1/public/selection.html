<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор парусника — Regatta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .selection-container {
            max-width: 600px;
            margin: 40px auto;
            background: rgba(0,0,0,0.85);
            padding: 30px;
            border-radius: 20px;
            color: white;
        }
        .ship-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .ship-card {
            background: rgba(255,255,255,0.05);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .ship-card:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px);
        }
        .ship-card.selected {
            border-color: #4a9eff;
            background: rgba(74,158,255,0.15);
        }
        .ship-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        .ship-card .ship-name {
            margin-top: 8px;
            font-weight: 600;
        }
        .ship-card .ship-stats {
            font-size: 12px;
            color: #8899aa;
        }
        .start-points {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }
        .start-point {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .start-point:hover {
            background: rgba(255,255,255,0.1);
        }
        .start-point.selected {
            border: 2px solid #4a9eff;
        }
        .btn-start {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4a9eff, #6c5ce7);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(74,158,255,0.4);
        }
        .btn-start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .map-preview {
            height: 200px;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="selection-container">
        <h1>⛵ Выбор парусника</h1>
        <p class="subtitle">Выберите корабль для гонки</p>

        <div class="ship-grid" id="ship-grid">
            <!-- Корабли будут добавлены через JS -->
        </div>

        <h2>📍 Выбор точки старта</h2>
        <div class="map-preview" id="map-preview"></div>
        <div class="start-points" id="start-points">
            <!-- Точки старта через JS -->
        </div>

        <button class="btn-start" id="btn-start" disabled>🚀 Начать гонку</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="selection.js"></script>
</body>
</html>
