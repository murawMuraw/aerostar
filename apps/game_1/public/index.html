<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regatta — Парусная регата</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ============================================
           ОСНОВНЫЕ СТИЛИ
        ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a1a2a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        /* ============================================
           ПАНЕЛЬ КОРАБЛЕЙ (слева) - УПРОЩЕННАЯ
        ============================================ */
        #ship-panel {
            position: fixed;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-height: 80vh;
            overflow-y: auto;
            min-width: 60px;
        }

        #ship-panel::-webkit-scrollbar { width: 3px; }
        #ship-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        /* Кнопка выбора корабля */
        .panel-action-btn {
            width: 60px;
            padding: 12px 8px;
            border: 2px solid rgba(255, 217, 102, 0.2);
            border-radius: 12px;
            background: rgba(255, 217, 102, 0.05);
            color: #ffd966;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .panel-action-btn:hover {
            border-color: #ffd966;
            background: rgba(255, 217, 102, 0.1);
            transform: scale(1.05);
        }

        .panel-action-btn .icon {
            font-size: 24px;
        }

        .panel-action-btn .label {
            font-size: 8px;
            margin-top: 3px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* ============================================
           КНОПКА HOME
        ============================================ */
        #btn-home {
            position: fixed;
            left: 15px;
            bottom: 30px;
            z-index: 1000;
            padding: 12px 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: #8899aa;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            letter-spacing: 1px;
        }

        #btn-home:hover {
            transform: scale(1.05);
            border-color: #ffd966;
            color: #ffd966;
            box-shadow: 0 0 25px rgba(255, 217, 102, 0.1);
        }

        /* ============================================
           ПАНЕЛЬ УПРАВЛЕНИЯ
        ============================================ */
        #controls-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 22px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            min-width: 400px;
            max-width: 95%;
        }

        #controls-panel .ctrl-group {
            display: flex;
            gap: 6px;
            padding: 0 8px;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        #controls-panel .ctrl-group:last-child { border-right: none; }

        #controls-panel .ctrl-btn {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #controls-panel .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        #controls-panel .ctrl-btn:active { transform: translateY(0); }

        #controls-panel .ctrl-btn.anchor-btn.active {
            background: rgba(255, 217, 61, 0.15);
            border-color: #ffd93d;
            color: #ffd93d;
        }

        #controls-panel .ship-info-display {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #8899aa;
            padding: 0 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #controls-panel .ship-info-display span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #controls-panel .ship-info-display .value { color: #fff; font-weight: 600; }

        .sail-bar-mini {
            width: 50px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .sail-bar-mini .fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd966, #f6b26b);
            border-radius: 4px;
            transition: width 0.3s;
        }

        /* ============================================
           ЧАТ
        ============================================ */
        #chat {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 280px;
            height: 300px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        #chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.04);
            font-size: 13px;
            color: #8899aa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        #chat-toggle {
            background: none;
            border: none;
            color: #8899aa;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
        }

        #chat-messages {
            flex: 1;
            padding: 10px 14px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
        }

        #chat-messages .chat-system { color: #667788; font-style: italic; }
        #chat-messages .chat-user { color: #e8e8e8; }
        #chat-messages .chat-danger { color: #ff6b6b; }

        #chat-input-area {
            display: flex;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        #chat-input {
            flex: 1;
            padding: 8px 14px;
            border: none;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        #chat-send {
            padding: 8px 14px;
            border: none;
            background: rgba(74, 158, 255, 0.2);
            color: #4a9eff;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        #chat-send:hover { background: rgba(74, 158, 255, 0.3); }

        /* ============================================
           УВЕДОМЛЕНИЯ
        ============================================ */
        #notifications {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .notification {
            padding: 10px 24px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 14px;
            animation: slideDown 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: auto;
            max-width: 90%;
        }

        .notification.success { border-color: #4caf50; }
        .notification.warning { border-color: #ffa94d; }
        .notification.danger { border-color: #ff6b6b; }
        .notification.info { border-color: #4a9eff; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           КАСТОМНЫЙ POPUP ДЛЯ КОРАБЛЕЙ
        ============================================ */
        .leaflet-popup-content-wrapper {
            background: rgba(0, 0, 0, 0.9) !important;
            backdrop-filter: blur(12px) !important;
            border-radius: 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: #fff !important;
            min-width: 200px !important;
        }

        .leaflet-popup-tip {
            background: rgba(0, 0, 0, 0.9) !important;
        }

        .leaflet-popup-content {
            color: #fff !important;
            font-size: 13px !important;
            line-height: 1.6 !important;
            margin: 12px 14px !important;
        }

        .popup-ship-name {
            font-size: 16px;
            font-weight: 700;
            color: #ffd966;
            margin-bottom: 4px;
        }

        .popup-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .popup-status.online { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .popup-status.offline { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
        .popup-status.grounded { background: rgba(255, 0, 0, 0.2); color: #ff6b6b; }
        .popup-status.anchored { background: rgba(255, 217, 61, 0.2); color: #ffd93d; }
        .popup-status.eliminated { background: rgba(255, 0, 0, 0.3); color: #ff1744; }

        /* ============================================
           АДАПТИВ
        ============================================ */
        @media (max-width: 768px) {
            #ship-panel { left: 8px; padding: 8px 6px; gap: 6px; }
            .panel-action-btn { width: 44px; padding: 8px 4px; }
            .panel-action-btn .icon { font-size: 18px; }
            #controls-panel {
                min-width: unset;
                width: 98%;
                padding: 10px 12px;
                bottom: 15px;
            }
            #controls-panel .ctrl-btn { width: 36px; height: 36px; font-size: 14px; }
            #controls-panel .ship-info-display { font-size: 11px; gap: 8px; }
            #chat { width: 220px; height: 220px; right: 10px; bottom: 80px; }
            #btn-home { left: 8px; bottom: 80px; padding: 8px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1. КАРТА                                   -->
    <!-- ========================================== -->
    <div id="map"></div>

    <!-- ========================================== -->
    <!-- 2. ПАНЕЛЬ (слева) - ТОЛЬКО КНОПКА ВЫБОРА  -->
    <!-- ========================================== -->
    <div id="ship-panel">
        <a href="/selection.html" class="panel-action-btn" title="Выбрать корабль">
            <span class="icon">⛵</span>
            <span class="label">ВЫБОР</span>
        </a>
        <div id="guest-message" style="display:none; text-align:center; padding:8px; color:#8899aa; font-size:11px;">
            👁 Наблюдатель
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. КНОПКА HOME                             -->
    <!-- ========================================== -->
    <a id="btn-home" href="https://aerost.art/">HOME</a>

    <!-- ========================================== -->
    <!-- 4. ПАНЕЛЬ УПРАВЛЕНИЯ                      -->
    <!-- ========================================== -->
    <div id="controls-panel">
        <div class="ctrl-group">
            <button class="ctrl-btn" id="btn-left" title="Влево (←)">◄</button>
            <button class="ctrl-btn" id="btn-right" title="Вправо (→)">►</button>
        </div>
        <div class="ctrl-group">
            <button class="ctrl-btn" id="btn-raise" title="Поднять паруса (↑)">▲</button>
            <button class="ctrl-btn" id="btn-lower" title="Опустить паруса (↓)">▼</button>
        </div>
        <div class="ctrl-group" style="border-right: none;">
            <button class="ctrl-btn anchor-btn" id="btn-anchor" title="Якорь (Space)">⚓</button>
            <button class="ctrl-btn" id="resetBtn" title="Сбросить" style="color:#ff6b6b;">⟳</button>
        </div>
        <div class="ship-info-display">
            <span>⛵ <span class="value" id="ship-name-display">—</span></span>
            <span>🧭 <span class="value" id="heading-display">0°</span></span>
            <span>⚡ <span class="value" id="speed-display">0.0</span></span>
            <span>
                📈
                <div class="sail-bar-mini"><div class="fill" id="sail-fill-mini" style="width:50%"></div></div>
                <span class="value" id="sail-display-mini">50%</span>
            </span>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 5. ЧАТ                                     -->
    <!-- ========================================== -->
    <div id="chat">
        <div id="chat-header">
            <span>💬 Чат</span>
            <button id="chat-toggle">−</button>
        </div>
        <div id="chat-messages">
            <div class="chat-system">👋 Добро пожаловать в Regatta!</div>
            <div class="chat-system">Нажмите "ВЫБОР" чтобы выбрать корабль</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Сообщение..." disabled />
            <button id="chat-send" disabled>➤</button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 6. УВЕДОМЛЕНИЯ                             -->
    <!-- ========================================== -->
    <div id="notifications"></div>

    <!-- ========================================== -->
    <!-- 7. ПОДКЛЮЧЕНИЕ СКРИПТОВ                    -->
    <!-- ========================================== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
