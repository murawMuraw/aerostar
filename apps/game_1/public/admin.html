<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель Regatta</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .admin-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: rgba(0,0,0,0.85);
            border-radius: 20px;
            color: white;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .admin-header h1 {
            font-size: 24px;
        }
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .admin-tabs button {
            padding: 8px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        .admin-tabs button.active {
            background: #4a9eff;
        }
        .admin-panel {
            display: none;
        }
        .admin-panel.active {
            display: block;
        }
        .admin-panel label {
            display: block;
            margin: 10px 0 5px;
            color: #8899aa;
        }
        .admin-panel input, .admin-panel select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            color: white;
        }
        .admin-panel .btn-save {
            margin-top: 15px;
            padding: 10px 30px;
            background: #4a9eff;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        .admin-panel .btn-save:hover {
            background: #3a8eff;
        }
        .admin-map {
            height: 300px;
            border-radius: 12px;
            margin: 10px 0;
        }
        .current-race {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            margin: 10px 0;
        }
        .race-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .race-status.scheduled { background: #ffa94d; }
        .race-status.active { background: #4caf50; }
        .race-status.finished { background: #4a9eff; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>⚙️ Админ-панель Regatta</h1>
            <span id="admin-status">🟢 Онлайн</span>
        </div>

        <div class="admin-tabs">
            <button class="active" data-tab="race">🏁 Гонка</button>
            <button data-tab="schedule">📅 Расписание</button>
            <button data-tab="players">👥 Игроки</button>
        </div>

        <!-- Панель: Гонка -->
        <div class="admin-panel active" id="panel-race">
            <h3>Текущая гонка</h3>
            <div id="current-race-info">
                <p>Гонка не активна</p>
            </div>

            <h3>📍 Точка старта</h3>
            <div class="admin-map" id="start-map"></div>
            <label>Название</label>
            <input type="text" id="start-name" value="Порт Ливерпуль">
            <label>Широта</label>
            <input type="number" id="start-lat" value="53.4" step="0.01">
            <label>Долгота</label>
            <input type="number" id="start-lng" value="-3.0" step="0.01">

            <h3>📍 Точка финиша</h3>
            <label>Название</label>
            <input type="text" id="finish-name" value="Порт Нью-Йорк">
            <label>Широта</label>
            <input type="number" id="finish-lat" value="40.7" step="0.01">
            <label>Долгота</label>
            <input type="number" id="finish-lng" value="-74.0" step="0.01">

            <button class="btn-save" id="btn-save-race">💾 Сохранить гонку</button>
            <button class="btn-save" id="btn-start-race" style="background: #4caf50;">🚀 Старт гонки</button>
            <button class="btn-save" id="btn-finish-race" style="background: #f44336;">🏁 Финиш</button>
        </div>

        <!-- Панель: Расписание -->
        <div class="admin-panel" id="panel-schedule">
            <h3>Расписание гонок</h3>
            <div id="schedule-list"></div>
            <button class="btn-save" id="btn-add-race">➕ Добавить гонку</button>
        </div>

        <!-- Панель: Игроки -->
        <div class="admin-panel" id="panel-players">
            <h3>Активные игроки</h3>
            <div id="players-list"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="admin.js"></script>
</body>
</html>
