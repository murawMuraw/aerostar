<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Regatta – Coming Soon</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* --- базовые стили (сохранены) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0b1a2e 0%, #1a3a5c 50%, #2d6a8f 100%);
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.03) 0px,
                rgba(255, 255, 255, 0.06) 40px,
                rgba(255, 255, 255, 0.02) 80px
            );
            animation: waveMove 8s linear infinite;
            pointer-events: none;
        }

        body::after {
            height: 50px;
            bottom: 20px;
            opacity: 0.5;
            animation-duration: 12s;
            animation-direction: reverse;
        }

        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(80px); }
        }

        /* --- главный контейнер (поверх карты) --- */
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 50px 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 10;
            pointer-events: auto;
        }

        .icon {
            font-size: 72px;
            display: block;
            margin-bottom: 20px;
            animation: floatIcon 4s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #f5e6c8;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #d4c4a8;
            margin-bottom: 25px;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f5e6c8, transparent);
            margin: 15px auto 25px;
            border-radius: 4px;
        }

        .description {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #e8ddd0;
            max-width: 650px;
            margin: 0 auto 30px;
            font-weight: 300;
        }

        .description strong {
            color: #ffd966;
            font-weight: 600;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 25px 0 35px;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.06);
            padding: 12px 22px;
            border-radius: 40px;
            font-size: 0.95rem;
            color: #d4c4a8;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
        }

        .feature-item span {
            margin-right: 8px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 10px 28px;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #ffd966;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s, transform 0.2s;
            border-bottom: 1px solid transparent;
        }

        .back-link:hover {
            color: #f5e6c8;
            transform: translateY(-2px);
            border-bottom-color: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                border-radius: 24px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .description {
                font-size: 1.05rem;
            }

            .features {
                gap: 12px;
            }

            .feature-item {
                font-size: 0.85rem;
                padding: 8px 16px;
            }

            .icon {
                font-size: 52px;
            }
        }

        /* --- Стили для карты (фон) --- */
        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background: #0b1a2e; /* на случай, если тайлы не загрузятся */
        }

        /* --- Легенда (поверх карты, но под контейнером) --- */
        .map-legend {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            color: #ddd;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            letter-spacing: 0.3px;
            z-index: 5;
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
        }

        .map-legend i {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4a9eff;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #4a9eff88;
        }
    </style>
</head>
<body>

    <!-- КАРТА (спутниковый слой) -->
    <div id="map"></div>

    <!-- Маленькая легенда -->
    <div class="map-legend">
        <i></i> Satellite view · both hemispheres
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="container">
        <span class="icon">⛵</span>

        <h1>Game Regatta</h1>
        <div class="subtitle">— Sailing with Real Wind &amp; Currents —</div>
        <div class="divider"></div>

        <p class="description">
            There will be a game here <strong>"Regatta"</strong> -<br />
            tea clipper racing using<br />
            <strong>real winds</strong> and <strong>ocean currents</strong>.
        </p>
      
        <div class="features">
            <span class="feature-item"><span>🌬️</span> Live Wind Data</span>
            <span class="feature-item"><span>🌊</span> Ocean Currents</span>
            <span class="feature-item"><span>⛵</span> Tea Clippers</span>
        </div>

        <a href="https://aerost.art/index.html" class="back-link">← Aerostar</a>
      
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>
        (function() {
            'use strict';

            // --- инициализация карты ---
            // Центр: (0, 0) — видно оба полушария, но немного сместим, чтобы Тихий океан не разрезал карту
            const map = L.map('map', {
                center: [0, 10],        // чуть смещено, чтобы Евразия и Америка были видны
                zoom: 2,
                zoomControl: false,     // убираем стандартные контролы для красоты
                attributionControl: false,
                fadeAnimation: false,
                zoomAnimation: false,
                markerZoomAnimation: false
            });

            // --- спутниковый слой (ESRI) — качественный, без надписей, видно оба полушария ---
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: '&copy; Esri',
                maxZoom: 19,
                minZoom: 1,
                noWrap: true,           // не зацикливать карту по горизонтали — видно оба полушария
                bounds: [[-90, -180], [90, 180]]
            }).addTo(map);

            // --- дополнительный слой (светлая подложка) на случай, если основной не загрузится ---
            // но он будет вторым, чтобы не мешать
            // (можно добавить как fallback, но в данном случае оставим только Esri для чистоты)

            // --- убираем возможность скролла карты колёсиком (чтобы не мешала) ---
            map.scrollWheelZoom.disable();

            // --- также отключаем перетаскивание (dragging), чтобы карта была статичной заглушкой ---
            map.dragging.disable();

            // --- если нужно, можно добавить пару маркеров для атмосферы (опционально) ---
            // L.marker([0, 0]).addTo(map).bindPopup('Equator');

            console.log('🌍 Satellite map loaded (Regatta placeholder)');
        })();
    </script>

</body>
</html>
