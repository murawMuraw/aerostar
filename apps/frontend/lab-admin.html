<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aerostar Admin — Контент Lab</title>
<style>
:root {
  --bg-1: #0b1220;
  --bg-2: #131a2e;
  --card: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: #e6edf7;
  --muted: #94a3b8;
  --amber: #f59e0b;
  --amber-dark: #d97706;
  --sky: #38bdf8;
  --sunset: #fbbf24;
  --danger: #ef4444;
  --success: #10b981;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background:
    radial-gradient(1200px 800px at 70% -10%, #1e2a4a 0%, var(--bg-1) 60%),
    linear-gradient(180deg, var(--bg-1), var(--bg-2));
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}

/* ============ HEADER ============ */
.admin-header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 32px;
  background: rgba(11,18,32,0.85);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.admin-logo {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--sunset);
}
.admin-logo span {
  color: var(--muted);
  font-weight: 400;
  margin-left: 8px;
  font-size: 13px;
}
.admin-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 13px;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: all .25s ease;
  font-family: inherit;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--amber), var(--amber-dark));
  color: #1a1207;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245,158,11,0.35); }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-ghost:hover { border-color: var(--sky); color: var(--sky); }
.btn-danger {
  background: transparent;
  border: 1px solid rgba(239,68,68,0.3);
  color: var(--danger);
}
.btn-danger:hover { background: rgba(239,68,68,0.1); }
.btn-small { padding: 7px 14px; font-size: 12px; }
.btn-icon {
  padding: 6px 10px;
  font-size: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
}
.btn-icon:hover { color: var(--danger); border-color: rgba(239,68,68,0.4); }

/* ============ LAYOUT ============ */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 24px 80px;
}

/* ============ TABS ============ */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  padding-bottom: 2px;
}
.tab {
  padding: 12px 22px;
  border-radius: 12px 12px 0 0;
  background: transparent;
  border: none;
  color: var(--muted);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all .25s ease;
  font-family: inherit;
  border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--text); }
.tab.active {
  color: var(--sunset);
  border-bottom-color: var(--sunset);
  background: rgba(251,191,36,0.05);
}

/* ============ PANELS ============ */
.panel { display: none; }
.panel.active { display: block; animation: fadeIn .3s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.panel-header {
  margin-bottom: 24px;
}
.panel-header h2 {
  font-size: 24px;
  margin-bottom: 6px;
  letter-spacing: -0.3px;
}
.panel-header p {
  color: var(--muted);
  font-size: 14px;
}

/* ============ SECTION ============ */
.section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 20px;
}
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-title h3 {
  font-size: 16px;
  letter-spacing: -0.2px;
}

/* ============ FORMS ============ */
.field {
  margin-bottom: 16px;
}
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.field input[type="text"],
.field input[type="url"],
.field textarea {
  width: 100%;
  padding: 11px 14px;
  background: rgba(15,23,42,0.7);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  transition: border-color .25s ease, background .25s ease;
}
.field input:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--sky);
  background: rgba(15,23,42,0.9);
}
.field textarea {
  resize: vertical;
  min-height: 80px;
  line-height: 1.5;
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.field-hint {
  font-size: 11px;
  color: #64748b;
  margin-top: 5px;
  font-style: italic;
}

/* ============ ITEM CARD ============ */
.item-card {
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
  position: relative;
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 18px;
}
.item-card-preview {
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  background: linear-gradient(135deg, #1e3a5f, #7c3aed 50%, #f59e0b);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  position: relative;
}
.item-card-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.item-card-body { min-width: 0; }
.item-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.item-card-header .num {
  font-size: 12px;
  font-weight: 700;
  color: var(--sky);
  letter-spacing: 1px;
}

/* ============ STATUS BAR ============ */
.status-bar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15,23,42,0.95);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  opacity: 0;
  transition: opacity .3s ease;
  pointer-events: none;
  z-index: 200;
}
.status-bar.show { opacity: 1; }
.status-bar.success { border-color: rgba(16,185,129,0.4); color: var(--success); }
.status-bar.error { border-color: rgba(239,68,68,0.4); color: var(--danger); }

/* ============ EMPTY STATE ============ */
.empty {
  text-align: center;
  padding: 30px;
  color: var(--muted);
  font-size: 13px;
  font-style: italic;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 768px) {
  .admin-header { padding: 12px 16px; }
  .admin-logo span { display: none; }
  .container { padding: 20px 16px 60px; }
  .field-row { grid-template-columns: 1fr; }
  .tab { padding: 10px 14px; font-size: 13px; }
  .section { padding: 18px; }
  .item-card {
    grid-template-columns: 1fr;
  }
  .item-card-preview {
    aspect-ratio: 16 / 9;
  }
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="admin-header">
  <div class="admin-logo">
    🎈 AEROSTAR <span>· Content Manager</span>
  </div>
  <div class="admin-actions">
    <button class="btn btn-ghost btn-small" id="export-btn">📤 Экспорт JSON</button>
    <button class="btn btn-ghost btn-small" id="import-btn">📥 Импорт JSON</button>
    <button class="btn btn-primary btn-small" id="save-btn">💾 Сохранить</button>
  </div>
</header>

<!-- ============ MAIN ============ -->
<div class="container">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" data-tab="gallery">🖼 Галерея</button>
    <button class="tab" data-tab="travel">✈️ Истории</button>
  </div>

  <!-- ============ GALLERY ============ -->
  <div class="panel active" data-panel="gallery">
    <div class="panel-header">
      <h2>🖼 Фото и арт-галерея</h2>
      <p>Добавляй изображения в раздел «Галерея» на странице lab.html. Каждое изображение можно подписать.</p>
    </div>

    <div class="section">
      <div class="section-title">
        <h3>Изображения</h3>
        <button class="btn btn-ghost btn-small" id="add-gallery-item">+ Добавить изображение</button>
      </div>
      <div id="gallery-items"></div>
    </div>
  </div>

  <!-- ============ TRAVEL ============ -->
  <div class="panel" data-panel="travel">
    <div class="panel-header">
      <h2>✈️ Истории путешествий</h2>
      <p>Истории для раздела «Путешествия» на lab.html — с картинкой, мета-описанием и текстом.</p>
    </div>

    <div class="section">
      <div class="section-title">
        <h3>Истории</h3>
        <button class="btn btn-ghost btn-small" id="add-travel-item">+ Добавить историю</button>
      </div>
      <div id="travel-items"></div>
    </div>
  </div>

</div>

<!-- ============ STATUS BAR ============ -->
<div class="status-bar" id="status-bar"></div>

<!-- ============ HIDDEN IMPORT INPUT ============ -->
<input type="file" id="import-file" accept=".json" style="display: none;">

<script>
// ============================================
// КОНСТАНТЫ
// ============================================
const STORAGE_KEY = 'aerostar_lab_content_v1';

// ============================================
// ДЕФОЛТНЫЕ ДАННЫЕ
// ============================================
const DEFAULT_DATA = {
  gallery: [],
  travel: []
};

// ============================================
// СОСТОЯНИЕ
// ============================================
let data = JSON.parse(JSON.stringify(DEFAULT_DATA));

// ============================================
// УТИЛИТЫ
// ============================================
function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function showStatus(msg, type = '') {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.className = 'status-bar show ' + type;
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => {
    bar.classList.remove('show');
  }, 2600);
}

function uid() {
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

// ============================================
// ГАЛЕРЕЯ
// ============================================
function renderGallery() {
  const container = document.getElementById('gallery-items');
  if (!data.gallery.length) {
    container.innerHTML = '<div class="empty">Изображений пока нет. Нажми «+ Добавить изображение».</div>';
    return;
  }
  container.innerHTML = data.gallery.map((item, i) => {
    const preview = item.img
      ? `<img src="${esc(item.img)}" alt="" onerror="this.style.display='none'; this.parentNode.textContent='🖼';">`
      : '🖼';
    return `
    <div class="item-card" data-index="${i}" data-id="${esc(item.id)}">
      <div class="item-card-preview">${preview}</div>
      <div class="item-card-body">
        <div class="item-card-header">
          <span class="num">ИЗОБРАЖЕНИЕ #${i + 1}</span>
          <button class="btn-icon" data-remove="gallery" data-index="${i}" title="Удалить">✕ Удалить</button>
        </div>
        <div class="field">
          <label>URL изображения *</label>
          <input type="url" data-field="gallery.${i}.img" value="${esc(item.img || '')}" placeholder="https://example.com/photo.jpg">
          <div class="field-hint">Прямая ссылка на картинку (jpg, png, webp, gif)</div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Название</label>
            <input type="text" data-field="gallery.${i}.title" value="${esc(item.title || '')}" placeholder="Рассвет над Альпами">
          </div>
          <div class="field">
            <label>Подпись (маленькая)</label>
            <input type="text" data-field="gallery.${i}.meta" value="${esc(item.meta || '')}" placeholder="Монблан, 3800 м">
          </div>
        </div>
      </div>
    </div>
    `;
  }).join('');
}

// ============================================
// ПУТЕШЕСТВИЯ
// ============================================
function renderTravel() {
  const container = document.getElementById('travel-items');
  if (!data.travel.length) {
    container.innerHTML = '<div class="empty">Историй пока нет. Нажми «+ Добавить историю».</div>';
    return;
  }
  container.innerHTML = data.travel.map((item, i) => {
    const preview = item.img
      ? `<img src="${esc(item.img)}" alt="" onerror="this.style.display='none'; this.parentNode.textContent='${esc(item.emoji || '✈️')}';">`
      : esc(item.emoji || '✈️');
    return `
    <div class="item-card" data-index="${i}" data-id="${esc(item.id)}">
      <div class="item-card-preview">${preview}</div>
      <div class="item-card-body">
        <div class="item-card-header">
          <span class="num">ИСТОРИЯ #${i + 1}</span>
          <button class="btn-icon" data-remove="travel" data-index="${i}" title="Удалить">✕ Удалить</button>
        </div>
        <div class="field">
          <label>URL обложки</label>
          <input type="url" data-field="travel.${i}.img" value="${esc(item.img || '')}" placeholder="https://example.com/cover.jpg">
          <div class="field-hint">Если пусто — покажется эмодзи-заглушка из поля ниже</div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Эмодзи-заглушка</label>
            <input type="text" data-field="travel.${i}.emoji" value="${esc(item.emoji || '')}" placeholder="🌊" maxlength="4">
          </div>
          <div class="field">
            <label>Мета (маршрут/регион)</label>
            <input type="text" data-field="travel.${i}.meta" value="${esc(item.meta || '')}" placeholder="Маршрут · 480 км">
          </div>
        </div>
        <div class="field">
          <label>Заголовок *</label>
          <input type="text" data-field="travel.${i}.title" value="${esc(item.title || '')}" placeholder="Через Ла-Манш">
        </div>
        <div class="field">
          <label>Описание *</label>
          <textarea data-field="travel.${i}.desc" placeholder="Как мы пересекли пролив на воздушном шаре...">${esc(item.desc || '')}</textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Текст ссылки</label>
            <input type="text" data-field="travel.${i}.linkText" value="${esc(item.linkText || 'Читать историю')}" placeholder="Читать историю">
          </div>
          <div class="field">
            <label>URL ссылки</label>
            <input type="text" data-field="travel.${i}.linkHref" value="${esc(item.linkHref || '#')}" placeholder="#">
          </div>
        </div>
      </div>
    </div>
    `;
  }).join('');
}

// ============================================
// ПРИВЯЗКА ИЗМЕНЕНИЙ
// ============================================
function bindInputs() {
  document.querySelectorAll('[data-field]').forEach(el => {
    if (el._bound) return;
    el._bound = true;

    const handler = () => {
      const path = el.dataset.field.split('.');
      let obj = data;
      for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]];
      obj[path[path.length - 1]] = el.value;

      // Обновляем превью картинки, если менялся URL
      if (path[path.length - 1] === 'img') {
        const card = el.closest('.item-card');
        const preview = card?.querySelector('.item-card-preview');
        if (preview) {
          if (el.value) {
            preview.innerHTML = `<img src="${esc(el.value)}" onerror="this.style.display='none'; this.parentNode.textContent='🖼';">`;
          } else {
            const fallback = card.querySelector('[data-field$=".emoji"]')?.value || '🖼';
            preview.textContent = fallback;
          }
        }
      }
      if (path[path.length - 1] === 'emoji') {
        const card = el.closest('.item-card');
        const preview = card?.querySelector('.item-card-preview');
        const imgField = card?.querySelector('[data-field$=".img"]');
        if (preview && (!imgField || !imgField.value)) {
          preview.textContent = el.value || '✈️';
        }
      }
    };

    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
}

// ============================================
// УДАЛЕНИЕ
// ============================================
document.addEventListener('click', (e) => {
  const removeBtn = e.target.closest('[data-remove]');
  if (removeBtn) {
    const type = removeBtn.dataset.remove;
    const index = parseInt(removeBtn.dataset.index, 10);
    if (confirm(`Удалить элемент #${index + 1}?`)) {
      data[type].splice(index, 1);
      renderAll();
    }
  }
});

// ============================================
// ДОБАВЛЕНИЕ
// ============================================
document.getElementById('add-gallery-item').addEventListener('click', () => {
  data.gallery.push({
    id: uid(),
    img: '',
    title: '',
    meta: ''
  });
  renderAll();
  // Скроллим к новой карточке
  setTimeout(() => {
    const cards = document.querySelectorAll('#gallery-items .item-card');
    cards[cards.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    cards[cards.length - 1]?.querySelector('input')?.focus();
  }, 50);
});

document.getElementById('add-travel-item').addEventListener('click', () => {
  data.travel.push({
    id: uid(),
    img: '',
    emoji: '✈️',
    meta: '',
    title: '',
    desc: '',
    linkText: 'Читать историю',
    linkHref: '#'
  });
  renderAll();
  setTimeout(() => {
    const cards = document.querySelectorAll('#travel-items .item-card');
    cards[cards.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    cards[cards.length - 1]?.querySelector('input')?.focus();
  }, 50);
});

// ============================================
// ВКЛАДКИ
// ============================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
  });
});

// ============================================
// СОХРАНЕНИЕ / ЗАГРУЗКА
// ============================================
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    showStatus('✅ Сохранено', 'success');
  } catch (err) {
    showStatus('❌ Ошибка: ' + err.message, 'error');
  }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      data = {
        gallery: Array.isArray(parsed.gallery) ? parsed.gallery : [],
        travel: Array.isArray(parsed.travel) ? parsed.travel : []
      };
    }
  } catch (err) {
    console.error('Load error:', err);
  }
}

document.getElementById('save-btn').addEventListener('click', save);

// Автосохранение при изменениях с задержкой
let autosaveTimer;
document.addEventListener('input', () => {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  }, 800);
});

// ============================================
// ЭКСПОРТ
// ============================================
document.getElementById('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `aerostar-lab-content-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showStatus('📤 JSON скачан', 'success');
});

// ============================================
// ИМПОРТ
// ============================================
document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      data = {
        gallery: Array.isArray(parsed.gallery) ? parsed.gallery : [],
        travel: Array.isArray(parsed.travel) ? parsed.travel : []
      };
      renderAll();
      save();
      showStatus('📥 JSON загружен', 'success');
    } catch (err) {
      showStatus('❌ Неверный JSON: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ============================================
// РЕНДЕР
// ============================================
function renderAll() {
  renderGallery();
  renderTravel();
