<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aerostar — Lab Content Admin</title>
<style>
:root {
  --bg-1: #0b1220; --bg-2: #131a2e;
  --card: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: #e6edf7; --muted: #94a3b8;
  --amber: #f59e0b; --amber-dark: #d97706;
  --sky: #38bdf8; --sunset: #fbbf24;
  --danger: #ef4444; --success: #10b981;
  --pink: #f472b6;
  --ru: #38bdf8;
  --en: #a78bfa;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(1200px 800px at 70% -10%, #1e2a4a 0%, var(--bg-1) 60%),
              linear-gradient(180deg, var(--bg-1), var(--bg-2));
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
}

/* LOGIN */
#login-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(800px 500px at 50% 20%, rgba(56,189,248,0.08), transparent 70%), var(--bg-1);
  z-index: 9000;
}
.login-card {
  background: rgba(15,23,42,0.95);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 40px 36px; width: 400px; max-width: calc(100vw - 40px);
  text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.login-card h1 {
  font-size: 26px; margin-bottom: 28px;
  color: var(--pink);
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
.login-label { display: block; text-align: left; font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
.login-input {
  width: 100%; padding: 14px 16px;
  background: rgba(11,18,32,0.8); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 15px; font-family: inherit;
  margin-bottom: 22px;
}
.login-input:focus { outline: none; border-color: var(--sky); }
.login-btn {
  width: 100%; padding: 14px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, #0284c7, #0ea5e9);
  color: white; font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: all .25s ease;
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(14,165,233,0.4); }
.login-error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

/* HEADER */
.admin-header {
  position: sticky; top: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 32px;
  background: rgba(11,18,32,0.85); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.admin-logo { font-size: 16px; font-weight: 700; color: var(--sunset); letter-spacing: 1px; }
.admin-logo span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
.admin-actions { display: flex; gap: 10px; align-items: center; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; border-radius: 999px;
  font-weight: 600; font-size: 13px; text-decoration: none;
  border: none; cursor: pointer; font-family: inherit;
  transition: all .25s ease; white-space: nowrap;
}
.btn-primary { background: linear-gradient(135deg, var(--amber), var(--amber-dark)); color: #1a1207; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245,158,11,0.35); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { border-color: var(--sky); color: var(--sky); }
.btn-danger { background: transparent; border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
.btn-danger:hover { background: rgba(239,68,68,0.1); }
.btn-small { padding: 7px 14px; font-size: 12px; }

/* LAYOUT */
.container { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; }

.tabs {
  display: flex; gap: 8px; margin-bottom: 28px;
  border-bottom: 1px solid var(--border); padding-bottom: 2px;
}
.tab {
  padding: 12px 22px; border-radius: 12px 12px 0 0;
  background: transparent; border: none; color: var(--muted);
  font-weight: 600; font-size: 14px; cursor: pointer;
  font-family: inherit; border-bottom: 2px solid transparent;
  transition: all .25s ease;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--sunset); border-bottom-color: var(--sunset); background: rgba(251,191,36,0.05); }

.panel { display: none; }
.panel.active { display: block; }
.panel-header { margin-bottom: 24px; }
.panel-header h2 { font-size: 24px; margin-bottom: 6px; }
.panel-header p { color: var(--muted); font-size: 14px; }

.section {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 24px; margin-bottom: 20px;
}

/* СЛОТЫ ГАЛЕРЕИ */
.slots-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}
.slot {
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.slot-header {
  display: flex; justify-content: space-between; align-items: center;
}
.slot-id {
  font-size: 13px; font-weight: 700; color: var(--sky);
  letter-spacing: 1px;
  background: rgba(56,189,248,0.1);
  padding: 3px 10px; border-radius: 6px;
}
.slot-fill {
  font-size: 11px; color: var(--muted);
  padding: 3px 8px; border-radius: 6px;
  background: rgba(148,163,184,0.1);
}
.slot-fill.ok { color: var(--success); background: rgba(16,185,129,0.1); }

.slot-preview {
  aspect-ratio: 16 / 10;
  border-radius: 10px;
  overflow: hidden;
  background: linear-gradient(135deg, #1e3a5f, #7c3aed 50%, #f59e0b);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; position: relative;
}
.slot-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot-preview .slot-error {
  font-size: 11px; color: #fca5a5;
  padding: 8px; text-align: center;
  background: rgba(0,0,0,0.5);
  border-radius: 6px;
}

/* ДВУЯЗЫЧНЫЕ ПОЛЯ */
.field { display: flex; flex-direction: column; gap: 5px; }
.field label {
  font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: 0.3px; text-transform: uppercase;
}
.field input[type="text"],
.field input[type="url"],
.field textarea {
  width: 100%; padding: 9px 11px;
  background: rgba(15,23,42,0.7); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 13px;
  font-family: inherit;
}
.field input:focus, .field textarea:focus {
  outline: none; border-color: var(--sky);
}
.field textarea { resize: vertical; min-height: 60px; line-height: 1.4; }
.field-hint { font-size: 10px; color: #64748b; font-style: italic; }

/* Двуязычная пара */
.bi-field {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.bi-field .lang-ru input,
.bi-field .lang-ru textarea {
  border-left: 3px solid var(--ru);
}
.bi-field .lang-en input,
.bi-field .lang-en textarea {
  border-left: 3px solid var(--en);
}
.lang-tag {
  font-size: 9px; font-weight: 700; letter-spacing: 1px;
  padding: 1px 5px; border-radius: 3px;
  margin-left: 4px;
}
.lang-tag.ru { background: rgba(56,189,248,0.2); color: var(--ru); }
.lang-tag.en { background: rgba(167,139,250,0.2); color: var(--en); }

/* ЖУРНАЛ (истории) */
.story-slot {
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
}
.story-slot-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.story-top {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 18px;
  margin-bottom: 16px;
}
.story-preview {
  aspect-ratio: 16 / 10;
  border-radius: 10px; overflow: hidden;
  background: linear-gradient(135deg, #0c4a6e, #f59e0b);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px;
}
.story-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* STATUS BAR */
.status-bar {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: rgba(15,23,42,0.95);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 10px 20px; font-size: 13px; font-weight: 600;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  opacity: 0; transition: opacity .3s ease;
  pointer-events: none; z-index: 200;
}
.status-bar.show { opacity: 1; }
.status-bar.success { border-color: rgba(16,185,129,0.4); color: var(--success); }
.status-bar.error { border-color: rgba(239,68,68,0.4); color: var(--danger); }

@media (max-width: 900px) {
  .story-top { grid-template-columns: 1fr; }
  .bi-field { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .admin-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
  .admin-logo span { display: none; }
  .container { padding: 20px 16px 60px; }
  .slots-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <h1><span>🔒</span> Admin Access</h1>
    <label class="login-label" for="admin-key">Admin Key</label>
    <input type="password" id="admin-key" class="login-input" placeholder="Enter admin key" autocomplete="off">
    <button class="login-btn" id="login-btn">Login</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- PANEL -->
<div id="admin-panel" style="display: none;">

  <header class="admin-header">
    <div class="admin-logo">🎈 AEROSTAR <span>· Lab Content</span></div>
    <div class="admin-actions">
      <button class="btn btn-ghost btn-small" id="export-btn">📤 Экспорт JSON</button>
      <button class="btn btn-ghost btn-small" id="import-btn">📥 Импорт JSON</button>
      <button class="btn btn-primary btn-small" id="save-btn">💾 Сохранить</button>
      <button class="btn btn-danger btn-small" id="logout-btn">🚪 Выйти</button>
    </div>
  </header>

  <div class="container">

    <div class="tabs">
      <button class="tab active" data-tab="gallery">🖼 Галерея (8)</button>
      <button class="tab" data-tab="travel">✈️ Истории (3)</button>
    </div>

    <!-- GALLERY -->
    <div class="panel active" data-panel="gallery">
      <div class="panel-header">
        <h2>🖼 Фото и арт-галерея</h2>
        <p>Восемь слотов F1–F8. Для каждого — поля на русском и английском. Картинки в <code>images/lab/</code>.</p>
      </div>
      <div class="section">
        <div class="slots-grid" id="gallery-slots"></div>
      </div>
    </div>

    <!-- TRAVEL -->
    <div class="panel" data-panel="travel">
      <div class="panel-header">
        <h2>✈️ Истории путешествий</h2>
        <p>Три слота S1–S3. HTML в поле «Полный текст» — можно <code>&lt;h3&gt;</code>, <code>&lt;p&gt;</code>, <code>&lt;b&gt;</code>, <code>&lt;img&gt;</code>. Доп. фото — до 3.</p>
      </div>
      <div class="section" id="travel-slots"></div>
    </div>

  </div>

  <div class="status-bar" id="status-bar"></div>
  <input type="file" id="import-file" accept=".json" style="display: none;">
</div>

<script>
// ============================================
const ADMIN_KEY = 'aerostar2024';
const AUTH_STORAGE = 'aerostar_lab_admin_ok';
const STORAGE_KEY = 'aerostar_lab_content_v3';
const IMG_BASE = 'images/lab/';

const GALLERY_IDS = ['F1','F2','F3','F4','F5','F6','F7','F8'];
const TRAVEL_IDS  = ['S1','S2','S3'];

const DEFAULT_DATA = {
  gallery: Object.fromEntries(GALLERY_IDS.map(id => [id, {
    img: '', title_ru: '', title_en: '', meta_ru: '', meta_en: '', desc_ru: '', desc_en: ''
  }])),
  travel: Object.fromEntries(TRAVEL_IDS.map(id => [id, {
    img: '', emoji: '✈️',
    meta_ru: '', meta_en: '',
    title_ru: '', title_en: '',
    short_ru: '', short_en: '',
    html_ru: '', html_en: '',
    extraPhotos: []
  }]))
};

let data = JSON.parse(JSON.stringify(DEFAULT_DATA));

// ============================================
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function showStatus(msg, type = '') {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.className = 'status-bar show ' + type;
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => bar.classList.remove('show'), 2600);
}

// ============================================
// LOGIN
// ============================================
function checkAuth() { return sessionStorage.getItem(AUTH_STORAGE) === '1'; }
function doLogin() {
  const key = document.getElementById('admin-key').value.trim();
  const err = document.getElementById('login-error');
  if (key === ADMIN_KEY) {
    sessionStorage.setItem(AUTH_STORAGE, '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    load(); renderAll();
  } else {
    err.textContent = 'Неверный ключ.';
    document.getElementById('admin-key').value = '';
  }
}
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('admin-key').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('logout-btn').addEventListener('click', () => {
  sessionStorage.removeItem(AUTH_STORAGE);
  location.reload();
});

// ============================================
// ХЕЛПЕР: двуязычная пара полей
// ============================================
function biField(label, path, ruValue, enValue, multiline = false, placeholderRu = '', placeholderEn = '') {
  const tag = multiline ? 'textarea' : 'input';
  const common = multiline ? '' : 'type="text"';
  return `
    <div class="field">
      <label>${label}</label>
      <div class="bi-field">
        <div class="lang-ru">
          <${tag} ${common} data-field="${path}_ru" placeholder="${esc(placeholderRu)}">${multiline ? esc(ruValue) : ''}</${tag}>
        </div>
        <div class="lang-en">
          <${tag} ${common} data-field="${path}_en" placeholder="${esc(placeholderEn)}">${multiline ? esc(enValue) : ''}</${tag}>
        </div>
      </div>
    </div>
  `;
  // Для input'ов — значение вставим через JS после рендера
}

// ============================================
// РЕНДЕР ГАЛЕРЕИ
// ============================================
function renderGallery() {
  const c = document.getElementById('gallery-slots');
  c.innerHTML = GALLERY_IDS.map(id => {
    const item = data.gallery[id] || {};
    const hasImg = !!item.img;
    const preview = hasImg
      ? `<img src="${IMG_BASE}${esc(item.img)}" onerror="this.parentNode.innerHTML='<span class=\\'slot-error\\'>❌ Не найдено: ${esc(item.img)}</span>';">`
      : '<span style="opacity:.4">🖼</span>';
    return `
    <div class="slot" data-slot="gallery" data-id="${id}">
      <div class="slot-header">
        <span class="slot-id">${id}</span>
        <span class="slot-fill ${hasImg ? 'ok' : ''}">${hasImg ? '✓' : 'пусто'}</span>
      </div>
      <div class="slot-preview" data-preview>${preview}</div>

      <div class="field">
        <label>Файл *</label>
        <input type="text" data-field="gallery.${id}.img" value="${esc(item.img || '')}" placeholder="${id}.jpg">
        <div class="field-hint">Имя файла в images/lab/</div>
      </div>

      ${biField('Название', `gallery.${id}.title`, item.title_ru, item.title_en, false, 'Рассвет над Альпами', 'Sunrise over the Alps')}
      ${biField('Подпись', `gallery.${id}.meta`, item.meta_ru, item.meta_en, false, 'Монблан, 3800 м', 'Mont Blanc, 3800 m')}
      ${biField('Описание (для fullsize)', `gallery.${id}.desc`, item.desc_ru, item.desc_en, true, '', '')}
    </div>`;
  }).join('');

  // Вставляем значения в input'ы (biField не вставляет value для input)
  GALLERY_IDS.forEach(id => {
    const item = data.gallery[id];
    ['title','meta'].forEach(k => {
      const ru = c.querySelector(`[data-field="gallery.${id}.${k}_ru"]`);
      const en = c.querySelector(`[data-field="gallery.${id}.${k}_en"]`);
      if (ru) ru.value = item[`${k}_ru`] || '';
      if (en) en.value = item[`${k}_en`] || '';
    });
  });
}

// ============================================
// РЕНДЕР ИСТОРИЙ
// ============================================
function renderTravel() {
  const c = document.getElementById('travel-slots');
  c.innerHTML = TRAVEL_IDS.map(id => {
    const item = data.travel[id] || {};
    const hasImg = !!item.img;
    const preview = hasImg
      ? `<img src="${IMG_BASE}${esc(item.img)}" onerror="this.parentNode.innerHTML='<span class=\\'slot-error\\'>❌ ${esc(item.img)}</span>';">`
      : esc(item.emoji || '✈️');
    const extra = Array.isArray(item.extraPhotos) ? item.extraPhotos.join(', ') : '';
    return `
    <div class="story-slot" data-slot="travel" data-id="${id}">
      <div class="story-slot-header">
        <span class="slot-id">${id}</span>
        <span class="slot-fill ${hasImg ? 'ok' : ''}">${hasImg ? '✓ обложка есть' : 'нет обложки'}</span>
      </div>

      <div class="story-top">
        <div class="story-preview" data-preview>${preview}</div>
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div class="field">
            <label>Файл обложки</label>
            <input type="text" data-field="travel.${id}.img" value="${esc(item.img || '')}" placeholder="${id}.jpg">
          </div>
          <div class="field">
            <label>Эмодзи-заглушка</label>
            <input type="text" data-field="travel.${id}.emoji" value="${esc(item.emoji || '')}" maxlength="4" placeholder="🌊">
          </div>
          <div class="field">
            <label>Доп. фото (до 3, через запятую)</label>
            <input type="text" data-field="travel.${id}.extraPhotos" value="${esc(extra)}" placeholder="S1_1.jpg, S1_2.jpg">
          </div>
        </div>
      </div>

      ${biField('Мета (маршрут/регион)', `travel.${id}.meta`, item.meta_ru, item.meta_en, false, 'Маршрут · 480 км', 'Route · 480 km')}
      ${biField('Заголовок *', `travel.${id}.title`, item.title_ru, item.title_en, false, 'Через Ла-Манш', 'Across the Channel')}
      ${biField('Краткое описание (для карточки) *', `travel.${id}.short`, item.short_ru, item.short_en, true, '', '')}
      ${biField('Полный текст истории (HTML) *', `travel.${id}.html`, item.html_ru, item.html_en, true, '<p>Первый абзац...</p>', '<p>First paragraph...</p>')}
    </div>`;
  }).join('');

  // Вставляем значения в input'ы
  TRAVEL_IDS.forEach(id => {
    const item = data.travel[id];
    ['meta','title'].forEach(k => {
      const ru = c.querySelector(`[data-field="travel.${id}.${k}_ru"]`);
      const en = c.querySelector(`[data-field="travel.${id}.${k}_en"]`);
      if (ru) ru.value = item[`${k}_ru`] || '';
      if (en) en.value = item[`${k}_en`] || '';
    });
  });
}

// ============================================
// ПРИВЯЗКА
// ============================================
function bindInputs() {
  document.querySelectorAll('[data-field]').forEach(el => {
    if (el._bound) return;
    el._bound = true;
    const handler = () => {
      const path = el.dataset.field.split('.');
      const [root, id, key] = path;

      if (key === 'extraPhotos') {
        data[root][id][key] = el.value.split(',').map(s => s.trim()).filter(Boolean);
      } else {
        data[root][id][key] = el.value;
      }

      // Обновление превью
      const slot = el.closest('[data-slot]');
      if (slot && (key === 'img' || key === 'emoji')) {
        const preview = slot.querySelector('[data-preview]');
        const imgVal = data[root][id].img;
        if (imgVal) {
          preview.innerHTML = `<img src="${IMG_BASE}${esc(imgVal)}" onerror="this.parentNode.innerHTML='<span class=\\'slot-error\\'>❌ ${esc(imgVal)}</span>';">`;
        } else {
          preview.textContent = data[root][id].emoji || '✈️';
        }
      }

      // Индикатор
      const slotEl = el.closest('.slot, .story-slot');
      if (slotEl) {
        const fill = slotEl.querySelector('.slot-fill');
        if (fill) {
          const hasImg = !!data[root][id].img;
          fill.textContent = hasImg ? '✓ заполнено' : 'пусто';
          fill.classList.toggle('ok', hasImg);
        }
      }

      scheduleAutosave();
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
}

// ============================================
// СОХРАНЕНИЕ / ЗАГРУЗКА
// ============================================
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    showStatus('✅ Сохранено', 'success');
  } catch (e) { showStatus('❌ ' + e.message, 'error'); }
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      GALLERY_IDS.forEach(id => {
        data.gallery[id] = Object.assign({
          img:'', title_ru:'', title_en:'', meta_ru:'', meta_en:'', desc_ru:'', desc_en:''
        }, parsed.gallery?.[id] || {});
      });
      TRAVEL_IDS.forEach(id => {
        data.travel[id] = Object.assign({
          img:'', emoji:'✈️', meta_ru:'', meta_en:'', title_ru:'', title_en:'',
          short_ru:'', short_en:'', html_ru:'', html_en:'', extraPhotos:[]
        }, parsed.travel?.[id] || {});
        if (!Array.isArray(data.travel[id].extraPhotos)) data.travel[id].extraPhotos = [];
      });
    }
  } catch (e) { console.error(e); }
}
let autosaveT;
function scheduleAutosave() {
  clearTimeout(autosaveT);
  autosaveT = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
  }, 800);
}
document.getElementById('save-btn').addEventListener('click', save);

// ============================================
// ЭКСПОРТ / ИМПОРТ
// ============================================
document.getElementById('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'lab-content.json';
  a.click();
  URL.revokeObjectURL(url);
  showStatus('📤 Скачано: lab-content.json', 'success');
});
document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      GALLERY_IDS.forEach(id => {
        data.gallery[id] = Object.assign({
          img:'', title_ru:'', title_en:'', meta_ru:'', meta_en:'', desc_ru:'', desc_en:''
        }, parsed.gallery?.[id] || {});
      });
      TRAVEL_IDS.forEach(id => {
        data.travel[id] = Object.assign({
          img:'', emoji:'✈️', meta_ru:'', meta_en:'', title_ru:'', title_en:'',
          short_ru:'', short_en:'', html_ru:'', html_en:'', extraPhotos:[]
        }, parsed.travel?.[id] || {});
        if (!Array.isArray(data.travel[id].extraPhotos)) data.travel[id].extraPhotos = [];
      });
      renderAll(); save();
      showStatus('📥 Загружено', 'success');
    } catch (err) { showStatus('❌ ' + err.message, 'error'); }
  };
  r.readAsText(file);
  e.target.value = '';
});

// ============================================
// ВКЛАДКИ
// ============================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
  });
});

// ============================================
function renderAll() {
  renderGallery();
  renderTravel();
  bindInputs();
}

window.addEventListener('load', () => {
  if (checkAuth()) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    load(); renderAll();
  }
});
</script>
</body>
</html>
