<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aerostar - LIVE Public Balloon</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        /* Стили для watch страницы */
        /* ... */
    </style>
</head>
<body>
    
    <div id="map"></div>
    
    <!-- Кнопка назад -->
    <a href="/" class="back-button">← HOME</a>
    
    <!-- LIVE бейдж -->
    <div class="live-badge">● LIVE</div>
    
    <!-- Информационная панель -->
    <div class="info-panel">
        <h3>🎈 Aerostar Public Balloon</h3>
        <p class="subtitle">Live tracking • Real-time updates</p>
        <div id="coords">
            <span class="status-dot"></span>
            Waiting for data...
        </div>
    </div>
    
    <!-- Статус -->
    <div id="connectionStatus">⏳ Connecting...</div>
    
    <!-- ========== СКРИПТЫ ========== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- ========== ВСЯ ЛОГИКА ИЗ INDEX.HTML ========== -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/balloon.js"></script>
    <script src="js/main.js"></script>
    
    <!-- ========== ТОЛЬКО НАСТРОЙКА WATCH ========== -->
    <script>
        console.log('🎈 Watch page initialized');
        
        // Ждем инициализации main.js
        document.addEventListener('DOMContentLoaded', () => {
            // Скрываем элементы управления с index.html
            setTimeout(() => {
                // Скрываем UI элементы
                document.querySelectorAll('.control-panel, .sidebar, .menu, .controls, #controls, .user-controls, #userControls, .user-panel, #userPanel')
                    .forEach(el => {
                        if (el) el.style.display = 'none';
                    });
                
                // Обновляем статус
                const statusEl = document.getElementById('connectionStatus');
                if (statusEl) {
                    statusEl.textContent = '🟢 Connected';
                    statusEl.style.borderLeftColor = '#00ff88';
                }
                
                console.log('✅ Watch page ready');
            }, 1000);
        });
        
        // Отслеживаем обновления публичного шара из balloon.js
        // main.js вызывает updatePublicBalloon когда приходят данные
        if (typeof window.updatePublicBalloon === 'function') {
            const originalUpdate = window.updatePublicBalloon;
            window.updatePublicBalloon = function(data) {
                // Вызываем оригинальную функцию
                if (originalUpdate) originalUpdate(data);
                
                // Обновляем координаты в панели
                if (data && data.position) {
                    const coordsEl = document.getElementById('coords');
                    if (coordsEl) {
                        coordsEl.innerHTML = `
                            <span class="status-dot"></span>
                            📍 ${data.position.lat.toFixed(6)}°, ${data.position.lng.toFixed(6)}°
                        `;
                    }
                }
            };
        }
    </script>
</body>
</html>
