<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aerostar - LIVE Public Balloon</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        
        #map {
            height: 100vh;
            width: 100%;
        }
        
        /* Кнопка назад */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        
        .back-button:hover {
            background: rgba(0,0,0,0.9);
            transform: translateX(-3px);
        }
        
        /* Информационная панель */
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 20px;
            border-radius: 15px;
            z-index: 1000;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 14px;
        }
        
        .info-panel h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
        }
        
        .info-panel p {
            margin: 0;
            opacity: 0.8;
            font-size: 12px;
        }
        
        .live-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: #ff0000;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        /* Индикатор загрузки */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 2000;
            text-align: center;
        }
        
        /* Адаптивность */
        @media (min-width: 768px) {
            .info-panel {
                left: auto;
                right: 20px;
                bottom: 20px;
                top: auto;
                min-width: 250px;
                text-align: left;
            }
            
            .back-button {
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <a href="/" class="back-button">
        ← HOME
    </a>
    
    <div class="live-badge">
        🔴 LIVE
    </div>
    
    <div class="info-panel">
        <h3>🎈 Aerostar Public Balloon</h3>
        
    </div>
    
    <div id="loading" class="loading">
        Loading...
    </div>

    <!-- Скрипты -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/watch.js"></script>
</body>
</html>
