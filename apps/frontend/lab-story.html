<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>История — Aerostar</title>
<style>
:root {
  --bg-1: #0b1220; --bg-2: #131a2e;
  --card: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: #e6edf7; --muted: #94a3b8;
  --amber: #f59e0b; --sky: #38bdf8; --sunset: #fbbf24;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(1200px 800px at 70% -10%, #1e2a4a 0%, var(--bg-1) 60%),
              linear-gradient(180deg, var(--bg-1), var(--bg-2));
  color: var(--text);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  line-height: 1.7;
  min-height: 100vh;
}
.back-link {
  position: fixed; top: 24px; left: 24px; z-index: 100;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: 999px;
  background: rgba(11,18,32,0.85); backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  color: var(--text); text-decoration: none;
  font-size: 13px; font-weight: 600;
  transition: all .25s ease;
}
.back-link:hover { border-color: var(--sky); color: var(--sky); }

.article {
  max-width: 780px;
  margin: 0 auto;
  padding: 100px 24px 80px;
}
.story-meta {
  font-size: 13px; color: var(--sunset);
  letter-spacing: 1px; text-transform: uppercase;
  font-weight: 600; margin-bottom: 12px;
}
.story-title {
  font-size: clamp(30px, 4vw, 44px);
  line-height: 1.15; letter-spacing: -0.8px;
  margin-bottom: 28px;
}
.story-cover {
  width: 100%; aspect-ratio: 16/9;
  border-radius: 20px; overflow: hidden;
  background: linear-gradient(135deg, #0c4a6e, #f59e0b);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px; margin-bottom: 40px;
  border: 1px solid var(--border);
}
.story-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

.story-body {
  font-size: 17px; color: #cbd5e1;
}
.story-body p { margin: 0 0 20px; }
.story-body h2, .story-body h3 {
  color: var(--text);
  margin: 36px 0 16px;
  letter-spacing: -0.3px;
  line-height: 1.3;
}
.story-body h2 { font-size: 26px; }
.story-body h3 { font-size: 21px; }
.story-body img {
  max-width: 100%; height: auto;
  border-radius: 14px; margin: 24px 0;
  border: 1px solid var(--border);
}
.story-body a { color: var(--sky); text-decoration: underline; }
.story-body blockquote {
  border-left: 3px solid var(--sunset);
  padding: 4px 0 4px 20px;
  margin: 24px 0;
  color: var(--muted);
  font-style: italic;
}
.story-body ul, .story-body ol { margin: 0 0 20px 24px; }
.story-body li { margin-bottom: 8px; }

.extra-photos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-top: 48px;
}
.extra-photos img {
  width: 100%; aspect-ratio: 4/3;
  object-fit: cover; border-radius: 14px;
  border: 1px solid var(--border);
  cursor: zoom-in;
  transition: transform .3s ease;
}
.extra-photos img:hover { transform: scale(1.02); }

.not-found {
  text-align: center; padding: 100px 24px;
  color: var(--muted);
}
.not-found h1 { font-size: 28px; margin-bottom: 12px; color: var(--text); }

/* Photo modal */
.photo-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.92);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center; justify-content: center;
  z-index: 9999; cursor: zoom-out;
}
.photo-modal.open { display: flex; }
.photo-modal img {
  max-width: 92vw; max-height: 90vh;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<a href="lab.html#travel" class="back-link">← К путешествиям</a>

<article class="article" id="article"></article>

<div class="photo-modal" id="photo-modal">
  <img id="photo-modal-img" src="" alt="">
</div>

<script>
const IMG_BASE = 'images/lab/';
const CONTENT_URL = 'lab-content.json';

// Базовая санитизация: разрешаем только безопасные теги
function sanitize(html) {
  const allowed = ['P','H2','H3','H4','B','STRONG','I','EM','U','BR','HR','IMG','A','BLOCKQUOTE','UL','OL','LI'];
  const tmp = document.createElement('div');
  tmp.innerHTML = html;

  function walk(node) {
    const children = [...node.childNodes];
    for (const child of children) {
      if (child.nodeType === 1) { // element
        if (!allowed.includes(child.tagName)) {
          // Заменяем на текстовое содержимое
          const text = document.createTextNode(child.textContent || '');
          child.replaceWith(text);
          continue;
        }
        // Удаляем опасные атрибуты
        [...child.attributes].forEach(attr => {
          const name = attr.name.toLowerCase();
          const val = attr.value.trim();
          if (name.startsWith('on')) { child.removeAttribute(attr.name); return; }
          if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(val)) {
            child.removeAttribute(attr.name);
          }
        });
        walk(child);
      }
    }
  }
  walk(tmp);
  return tmp.innerHTML;
}

async function load() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const container = document.getElementById('article');

  if (!id || !/^S[1-3]$/.test(id)) {
    container.innerHTML = `<div class="not-found"><h1>История не найдена</h1><p>Вернись на <a href="lab.html#travel" style="color:var(--sky)">главную</a>.</p></div>`;
    return;
  }

  let content;
  try {
    const res = await fetch(CONTENT_URL + '?t=' + Date.now());
    content = await res.json();
  } catch (e) {
    container.innerHTML = `<div class="not-found"><h1>Не удалось загрузить контент</h1><p>${e.message}</p></div>`;
    return;
  }

  const story = content.travel?.[id];
  if (!story) {
    container.innerHTML = `<div class="not-found"><h1>История ${id} ещё не заполнена</h1></div>`;
    return;
  }

  document.title = (story.title || 'История') + ' — Aerostar';

  const coverHtml = story.img
    ? `<img src="${IMG_BASE + story.img}" alt="">`
    : (story.emoji || '✈️');

  const extraHtml = Array.isArray(story.extraPhotos) && story.extraPhotos.length
    ? `<div class="extra-photos">${story.extraPhotos.map(f =>
        `<img src="${IMG_BASE + f}" loading="lazy" onclick="openModal('${IMG_BASE + f}')">`
      ).join('')}</div>`
    : '';

  container.innerHTML = `
    ${story.meta ? `<div class="story-meta">${escapeHtml(story.meta)}</div>` : ''}
    <h1 class="story-title">${escapeHtml(story.title || '')}</h1>
    <div class="story-cover">${coverHtml}</div>
    <div class="story-body">${sanitize(story.html || '')}</div>
    ${extraHtml}
  `;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openModal(src) {
  document.getElementById('photo-modal-img').src = src;
  document.getElementById('photo-modal').classList.add('open');
}
document.getElementById('photo-modal').addEventListener('click', () => {
  document.getElementById('photo-modal').classList.remove('open');
});

load();
</script>
</body>
</html>
