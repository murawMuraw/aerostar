<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Atmosphere Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b111f;
      background-image: radial-gradient(circle at 50% 0%, #1a2a4a 0%, #0b111f 70%);
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: #1b263b;
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .image-wrapper {
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      margin-bottom: 30px;
    }
    .image-wrapper img {
      width: 100%;
      height: auto;
      max-height: 600px;
      object-fit: contain;
      display: block;
    }
    .text-field {
      background: #243447;
      border-radius: 16px;
      padding: 24px 28px;
      font-size: 18px;
      line-height: 1.7;
      color: #d0dcee;
      min-height: 320px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid #3a4a66;
    }
    .text-field strong {
      color: #ffb347;
    }
    .back-link {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 32px;
      background: #ff9800;
      border-radius: 40px;
      color: #0b111f;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }
    .back-link:hover {
      transform: scale(1.05);
      background: #ffa726;
    }
    .caption-title {
      color: #ffb347;
      font-size: 22px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="image-wrapper">
    <img id="galleryImage" src="" alt="Full view">
  </div>
  <div class="caption-title" id="captionTitle"></div>
  <div class="text-field" id="textField">
    <!-- Здесь будет 20 строк текста -->
  </div>
  <a href="index.html" class="back-link">← Back to Lab</a>
</div>

<script>
  // Получаем параметры из URL
  const params = new URLSearchParams(window.location.search);
  const imgName = params.get('img') || 'La.png';
  const caption = params.get('caption') || 'Journey snapshot';

  // Формируем путь к изображению
  document.getElementById('galleryImage').src = 'images/lab/' + imgName;

  // Заголовок
  document.getElementById('captionTitle').textContent = '📌 ' + caption;

  // Текстовое поле на 20 строк (заполняем подробным описанием)
  const descriptions = {
    'La.png': `I had intended to look into the possibility of crossing the strait in a balloon, but I got carried away by the flight. The result was a flight over the Atlantic lasting several days.`,

    'Paris_1.png': `In the footsteps of Montgolfier.

On November 21, 1783, at 1:54 PM, a Montgolfier balloon carrying pilots Pilâtre de Rozier and the Marquis d'Arlandes lifted off from the gardens of the Château de la Muette in Passy. After flying over Paris, it landed 25 minutes later in another suburb, Butte-aux-Cailles, having covered a distance of approximately 9 kilometers at an altitude of up to one kilometer.

In the simulation, the balloon flew in the opposite direction; however, that launch took place in the summer. We will repeat the attempt on November 21.`,

    'pilot_fiesta.png': `Balloon journey result — Fiesta Experiment.

An exploration in the form of a game: starting on the West Coast and finishing in Washington. It showcases the pilots' skill in catching the wind at various altitudes.`
  };

  // Если описание для конкретного изображения есть — используем его, иначе генерируем из caption
  let textContent = descriptions[imgName];
  if (!textContent) {
    textContent = `📝 ${caption}\n\n`;
    for (let i = 1; i <= 19; i++) {
      textContent += `This is line ${i} of the detailed description for "${caption}".\n`;
    }
    textContent += `The full story of this journey will be added soon.`;
  }

  document.getElementById('textField').textContent = textContent;
</script>
</body>
</html>
